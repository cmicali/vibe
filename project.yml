name: Vibe

options:
  bundleIdPrefix: com.commonwealthrecordings
  deploymentTarget:
    macOS: "13.0"
    iOS: "26.0"
  createIntermediateGroups: true
  settingPresets: none
  developmentLanguage: en
  fileTypes:
    icon:                     # Icon Composer AppIcon.icon: treat the .icon package as a single
      file: true              # file reference (not a group to recurse into) so actool compiles it.

configs:
  Debug: debug
  Release: release

# Shared between the app targets so a second platform cannot drift from the
# first on where TagLib, PINCache and the generated git-info header live.
settingGroups:
  # THE version, for every target: both apps ship under one bundle identifier,
  # so they must carry the same number, and a per-target copy drifts silently.
  # A release bumps these two lines and nothing else; the release scripts read
  # the number back out of the BUILT app.
  vibe-version:
    MARKETING_VERSION: "1.14-beta4"
    CURRENT_PROJECT_VERSION: 303

  vibe-header-paths:
    HEADER_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/build/generated"      # VibeGitInfo.h, written by the pre-build script
      - "$(SRCROOT)/Vibe/ThirdParty/taglib"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/toolkit"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg/id3v1"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg/id3v2"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg/id3v2/frames"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/ape"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/mp4"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/flac"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/riff"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/riff/aiff"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/riff/wav"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/ogg"
      - "$(SRCROOT)/Vibe/ThirdParty"
      - "$(SRCROOT)/Vibe/ThirdParty/PINCache"
      - "$(SRCROOT)/Vibe/ThirdParty/PINOperation"

# ---- PROJECT-LEVEL settings (== PBXProject build configs) ----
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: 4UEV752JH4
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: c17
    GCC_NO_COMMON_BLOCKS: YES
    # 1 for betas: info, debug and warn are persisted at Default, so Save Debug
    # Info retrieves them, and every timed playback step is recorded, so a
    # report with nothing logged means the path was not taken. 0 for a stable
    # release: info and debug are stream-only, and only steps over their
    # threshold are recorded.
    VIBE_VERBOSE_LOGGING: 1
    # Nothing else fails on a compiler warning: the analyze gate matches only
    # checker findings. If a toolchain warns on vendored code, give that file a
    # per-file -Wno-* flag beside the PIN caches' entries rather than turning
    # this off.
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    GCC_PRECOMPILE_PREFIX_HEADER: YES
    GCC_PREFIX_HEADER: "$(SRCROOT)/Vibe/Common/Vibe-Prefix.pch"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MTL_FAST_MATH: YES
    SDKROOT: macosx
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES   # Export/Import Localizations round-trips .xcstrings
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - "DEBUG=1"
        - "VIBE_VERBOSE_LOGGING=$(VIBE_VERBOSE_LOGGING)"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      # Only `archive` turns this on by itself, so without it a local Release
      # `build` (and `make install`) keeps its symbol table and is not what
      # ships. Symbolication comes from the dSYM either way.
      DEPLOYMENT_POSTPROCESSING: YES
      ENABLE_NS_ASSERTIONS: NO
      GCC_OPTIMIZATION_LEVEL: s
      # NDEBUG is used in TagLib
      GCC_PREPROCESSOR_DEFINITIONS:
        - "NDEBUG=1"
        - "VIBE_VERBOSE_LOGGING=$(VIBE_VERBOSE_LOGGING)"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: NO

targets:
  Vibe:
    type: application
    platform: macOS
    sources:
      - path: main.m                          # repo root, outside Vibe/
      # One recursive entry per top-level subsystem rather than `- path: Vibe`,
      # so a new top-level boundary is a deliberate edit.
      #
      # THE DIRECTORY IS THE PLATFORM BOUNDARY: platform halves live in Mac/
      # and iOS/ subdirectories, so neither target needs a per-file or
      # feature-named exclude. Every shared entry carries "iOS/**" whether or
      # not that half exists yet. See the root AGENTS.md and make check-layout.
      - path: Vibe/Audio
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/Common
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/System
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/Util
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/WaveformUI
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/Controls
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/Playlist
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      # Every source here wraps its body in #if DEBUG: in both targets, shipped
      # in neither.
      - path: Vibe/Debug
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      # Vendored code is not restyled, so the analyzer skips it: its findings
      # would never be fixed, and it is a third of the files analyzed. The
      # -Xclang pair only takes effect under the analyzer.
      - path: Vibe/ThirdParty
        excludes:
          - "**/.DS_Store"
          - "**/*.md"                         # nested AGENTS.md guidance: keep UNbundled
          - "**/*.xcprivacy"                  # PIN privacy manifests: keep UNbundled
          - "**/*.txt"                        # vendored LICENSE.txt: keep UNbundled
          - "**/LICENSE.MPL"                  # TagLib's MPL 1.1 text: same, but not a .txt
          - "**/*.inc"                        # r8brain's filter tables, #included by its headers: keep UNbundled
          - "**/PINDiskCache.m"               # re-added below with its per-file flags
          - "**/r8bsrc.cpp"                   # same
          - "**/pffft_double.c"               # same
          - "**/dr_mp3.c"                     # same
        compilerFlags: &third-party-flags
          - "-Xclang"
          - "-analyzer-disable-all-checks"
      - path: Vibe/ThirdParty/PINCache/PINDiskCache.m
        compilerFlags: &pin-disk-cache-flags
          - "-fobjc-arc-exceptions"
          - "-Xclang"
          - "-analyzer-disable-all-checks"
      # r8brain's own C entry points, where every one of its header templates
      # is instantiated, and its FFT: optimized in every configuration, since
      # at -O0 it costs many times its optimized self, and a Debug build is
      # where the resampler's quality and cost tests run. The empty
      # R8BSRC_DECL is upstream's switch from a DLL to an object file;
      # R8B_PFFFT_DOUBLE (NEON, double precision, Ooura's accuracy) is its
      # README's speed setting. Its other, R8B_EXTFFT, is left off: at the 1%
      # transition band it costs 3-10% more, not less (docs/audio-quality.md).
      - path: Vibe/ThirdParty/r8brain/DLL/r8bsrc.cpp
        compilerFlags: &r8brain-flags
          - "-O3"
          - "-DR8BSRC_DECL="
          - "-DR8B_PFFFT_DOUBLE=1"
          - "-DPFFFT_ENABLE_NEON=1"           # PFFFT's NEON path is opt-in; without it arm64 builds its scalar fallback
          - "-w"                              # vendored C predates -Wstrict-prototypes; not ours to restyle
          - "-Xclang"
          - "-analyzer-disable-all-checks"
      - path: Vibe/ThirdParty/r8brain/fft/pffft_double.c
        compilerFlags: *r8brain-flags
      # dr_mp3's implementation unit, AudioFileHandle.m's default MPEG decoder:
      # optimized in every configuration, as r8brain is, so a Debug build
      # decodes as a shipped one does.
      - path: Vibe/ThirdParty/dr_mp3/dr_mp3.c
        compilerFlags: &dr-mp3-flags
          - "-O3"
          - "-w"                              # vendored C, not ours to restyle
          - "-Xclang"
          - "-analyzer-disable-all-checks"
      - path: Vibe/Mac/App
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
          - "**/Info.plist"                   # consumed via INFOPLIST_FILE; must NOT be bundled
      - path: Vibe/Mac/MainWindow
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Mac/Controls
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Mac/Menu
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Mac/About
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Mac/Settings
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Resources/Assets.xcassets       # .xcassets handled natively by XcodeGen
      - path: Resources/AppIcon.icon          # Icon Composer .icon (handled via options.fileTypes)
      - path: Resources/VectorBalls.metal.txt
        buildPhase: resources                 # runtime-compiled off-main; avoids optional Metal toolchain
      # The build only COMPILES the catalogs; `make strings` extracts keys
      # (nothing extracts ObjC strings at build time).
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Hand-managed (table "ThemeNames"): extraction never touches it;
      # check-translations covers it.
      - path: Resources/ThemeNames.xcstrings
        buildPhase: resources
      # A folder reference: every JSON dropped in ships as a built-in theme.
      - path: Resources/Themes
        type: folder
        buildPhase: resources
    preBuildScripts:
      # build/generated/VibeGitInfo.h for the launch provenance block; reading
      # .git needs ENABLE_USER_SCRIPT_SANDBOXING: NO (set below).
      - script: '"$SRCROOT/scripts/generate-git-info.sh"'
        name: Generate Git Info
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(SRCROOT)/build/generated/VibeGitInfo.h"
    info:
      path: Vibe/Mac/App/Info.plist
      properties:

        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        LSApplicationCategoryType: "public.app-category.music"

        NSHumanReadableCopyright: "Copyright © 2026 Christopher Micali. All rights reserved."

        ITSAppUsesNonExemptEncryption: false

        LSMultipleInstancesProhibited: YES
        NSSupportsAutomaticTermination: YES

        NSPrincipalClass: "NSApplication"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleInfoDictionaryVersion: "6.0"

        CFBundleDocumentTypes:
          - CFBundleTypeName: "Folder"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "public.folder"
          # com.apple.quicktime-audio is .qta, the QuickTime container Voice
          # Memos exports. It conforms to public.audio only, so neither MPEG-4
          # claim covers it.
          - CFBundleTypeName: "Audio Files"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Default"
            LSItemContentTypes:
              - "public.mp2"
              - "public.mp3"
              - "public.aac-audio"
              - "public.aiff-audio"
              - "com.microsoft.waveform-audio"
              - "org.xiph.flac"
              - "com.apple.m4a-audio"
              - "public.mpeg-4-audio"
              - "com.apple.quicktime-audio"
          - CFBundleTypeName: "CUE Sheet"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "com.commonwealthrecordings.cue-sheet"
          - CFBundleTypeName: "M3U Playlist"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "public.m3u-playlist"
          - CFBundleTypeName: "Converted FLAC"
            CFBundleTypeRole: "Editor"
            LSHandlerRank: "None"
            NSIsRelatedItemType: true
            LSItemContentTypes:
              - "org.xiph.flac"

        # macOS has no system UTI for cue sheets (they read as dyn.*).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: "com.commonwealthrecordings.cue-sheet"
            UTTypeDescription: "CUE Sheet"
            UTTypeConformsTo:
              - "public.plain-text"
            UTTypeTagSpecification:
              public.filename-extension:
                - "cue"

    settings:
      groups: [vibe-version, vibe-header-paths]
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.Vibe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CLANG_ENABLE_MODULES: YES
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/Vibe/Mac/App/Vibe.entitlements"
        CODE_SIGN_IDENTITY: "-"             # Sign to Run Locally: no dev cert; the release
                                            # scripts re-sign for distribution.
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO           # generate-git-info.sh reads .git
        ENABLE_USER_SELECTED_FILES: readwrite
        EXCLUDED_ARCHS: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited)"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - sdk: AVFAudio.framework             # AVAudioFormat/PCMBuffer/ChannelLayout; MediaPlayer loads AVFoundation regardless
      - sdk: Accelerate.framework
      - sdk: ApplicationServices.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: ImageIO.framework              # bounded art decode, debug screenshots
      - sdk: MediaPlayer.framework
      - sdk: Metal.framework                # VectorBallsView (About window)
      - sdk: MetalKit.framework             # VectorBallsView (About window)
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework  # file-type filtering

  # Every shared subsystem minus its Mac/ half, plus Vibe/iOS. Same bundle ID as
  # the mac app: the prerequisite for App Store universal purchase.
  VibeiOS:
    type: application
    platform: iOS
    sources:
      # A new file in a shared directory joins this target automatically, so it
      # must be AppKit-free or TARGET_OS_OSX-guarded; CI's iOS builds
      # enforce it. See the Vibe target above.
      - path: Vibe/iOS
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Audio
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/Common
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/System
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/Util
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/Controls
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/Playlist
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/WaveformUI
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/Debug
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/ThirdParty
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
          - "**/*.xcprivacy"
          - "**/*.txt"
          - "**/LICENSE.MPL"
          - "**/*.inc"
          - "**/PINDiskCache.m"
          - "**/r8bsrc.cpp"
          - "**/pffft_double.c"
          - "**/dr_mp3.c"
        # Same flags as the macOS target above; see the comment there.
        compilerFlags: *third-party-flags
      - path: Vibe/ThirdParty/PINCache/PINDiskCache.m
        compilerFlags: *pin-disk-cache-flags
      - path: Vibe/ThirdParty/r8brain/DLL/r8bsrc.cpp
        compilerFlags: *r8brain-flags
      - path: Vibe/ThirdParty/r8brain/fft/pffft_double.c
        compilerFlags: *r8brain-flags
      - path: Vibe/ThirdParty/dr_mp3/dr_mp3.c
        compilerFlags: *dr-mp3-flags
      - path: Resources/AppIcon.icon
      - path: Resources/Assets.xcassets       # record-bg, the no-art vinyl placeholder
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
    preBuildScripts:
      - script: '"$SRCROOT/scripts/generate-git-info.sh"'
        name: Generate Git Info
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(SRCROOT)/build/generated/VibeGitInfo.h"
    info:
      path: Vibe/iOS/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleInfoDictionaryVersion: "6.0"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: "public.app-category.music"
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 Christopher Micali. All rights reserved."
        UILaunchScreen: {}                    # system launch screen; no storyboard
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # All four on iPad: required for a non-fullscreen app, and iPadOS 26
        # windowing lets the user give the window any aspect.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          # One scene, deliberately: VibeiOSSceneDelegate owns the one
          # PlaybackController and its AudioPlayer, so a second scene would
          # create a second player. Still freely resizable on iPadOS 26.
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: VibeiOSSceneDelegate
        # Files-app integration: open-in-place from Files/share sheet, and a
        # visible on-device Documents folder.
        #
        # UIFileSharingEnabled is a product decision: the app's Documents
        # directory is a permanent search root (SearchFolderStore), and this is
        # the only way to put anything in it. The app keeps no state there.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        # Same key and UTIs as the mac target's "Audio Files" entry, so
        # InfoPlist.xcstrings localizes both. No Folder claim (Launch Services
        # folder handling is a mac concept) and no related-item FLAC entry
        # (Convert is not compiled on iOS).
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Audio Files"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Default"
            LSItemContentTypes:
              - "public.mp2"
              - "public.mp3"
              - "public.aac-audio"
              - "public.aiff-audio"
              - "com.microsoft.waveform-audio"
              - "org.xiph.flac"
              - "com.apple.m4a-audio"
              - "public.mpeg-4-audio"
              - "com.apple.quicktime-audio"
    settings:
      groups: [vibe-version, vibe-header-paths]
      base:
        PRODUCT_NAME: Vibe
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.Vibe
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"  # settingPresets: none injects neither
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        # The app group the widget reads through. The mac target has its own
        # entitlements for the sandbox; this file exists only for that group,
        # and the extension carries a matching copy.
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/Vibe/iOS/Vibe.entitlements"
        # The target's Swift is the WidgetKit reloader and the widget's App
        # Intent bodies: WidgetCenter and AppIntents have no Objective-C API.
        # The bridging header is what lets the intents reach VibeiOSSceneDelegate
        # and PlaybackController; ObjC reaches the Swift through Vibe-Swift.h.
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Vibe/iOS/Widget/Vibe-Bridging-Header.h"
        # VIBE_APP switches on the App Intent bodies in VibeWidgetIntents.swift,
        # which compiles into this target AND the extension; only this one can
        # link the classes they drive. settingPresets is none, so nothing sets
        # this for us.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VIBE_APP"
        ENABLE_USER_SCRIPT_SANDBOXING: NO     # generate-git-info.sh reads .git
        PROVISIONING_PROFILE_SPECIFIER: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: VibeWidget        # embedded into PlugIns/; see that target
      - sdk: AppIntents.framework           # the widget's transport intents
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework                # AVRoutePickerView (OutputRouteView)
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: ImageIO.framework
      - sdk: MediaPlayer.framework
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework

  # The home-screen widget. A SECOND PROCESS: no engine, no playlist, no audio
  # session, and it never opens an audio file. Everything it draws is the
  # snapshot the app publishes into the shared app group, which is why its only
  # shared sources are VibeWidgetState's pair — named file by file, because the
  # rest of Vibe/iOS/Widget/ is app-side code that reaches for app classes.
  #
  # Its own sources live OUTSIDE Vibe/, as Tests/ does and for the same reason:
  # the app targets recurse whole subsystem directories, so a file under Vibe/
  # would compile into the shipping apps as well. check-layout asserts the
  # top level of Vibe/ is in BOTH app targets, which an iOS-only extension
  # directory could never be.
  VibeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: VibeWidget
        excludes: ["**/.DS_Store", "**/*.md", "**/Info.plist"]
      - path: Vibe/iOS/Widget/VibeWidgetState.h
      - path: Vibe/iOS/Widget/VibeWidgetState.m
      # Shared with the app, which owns the bodies (VIBE_APP). The extension
      # needs the TYPES so its buttons can name them.
      - path: Vibe/iOS/Widget/VibeWidgetIntents.swift
      # Its catalog is VibeWidget/Localizable.xcstrings, picked up by the entry
      # above — the widget.* subset `make strings` derives, never edited by
      # hand. Why the widget needs its own: the TRAP in VibeWidgetIntents.swift.
    info:
      path: VibeWidget/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: Vibe
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      groups: [vibe-version]
      base:
        PRODUCT_NAME: VibeWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.Vibe.Widget
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/VibeWidget/VibeWidget.entitlements"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/VibeWidget/VibeWidget-Bridging-Header.h"
        GCC_PREFIX_HEADER: ""                 # no app pch: this target links no app class
        SKIP_INSTALL: YES
    dependencies:
      - sdk: AppIntents.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework

  # Not a test suite: the interactive touch driver for agentic workflows —
  # the iOS counterpart of the debug channel's key/click injection, which
  # UIKit cannot do in-process (no public UITouch synthesis). One resident
  # XCUITest command loop; drive-ios.sh in the vibe-debug skill starts it and
  # sends gestures. Sources live under Tests/ for the same reason VibeTests'
  # do: the app targets recurse whole subsystem directories under Vibe/.
  VibeiOSDriver:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/iOSDriver
    dependencies:
      - target: VibeiOS
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.VibeiOSDriver
        TEST_TARGET_NAME: VibeiOS
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"       # the driver must install beside the app on iPad sims too
        CODE_SIGN_STYLE: Automatic
        GCC_PREFIX_HEADER: ""               # no app pch; XCTest only

  # Host-LESS: no TEST_HOST, so the suite never launches the app and never
  # inherits its sandbox (which would block reading fixtures from the repo).
  # Sources under test are compiled in, so the list below is the deliberately
  # chosen tested surface. Tests live outside Vibe/ because the app targets
  # recurse whole subsystem directories.
  VibeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # The bundled built-in themes, so the suite's loader reads the SAME
      # files the app ships and testBundledThemesAreValid gates a theme PR.
      - path: Resources/Themes
        type: folder
        buildPhase: resources
      - path: Tests
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
          - "iOSDriver/**"                    # VibeiOSDriver's XCUI sources: iOS-only API
          - "AudioPlayerRenderTests.m"         # VibeAudioTests' suite
      - path: Vibe/Audio/Analysis/AudioBPMAnalyzer.mm
      - path: Vibe/Audio/Analysis/AudioKeyAnalyzer.mm
      - path: Vibe/Audio/Waveform/AudioWaveform.mm
      - path: Vibe/Audio/Waveform/AudioWaveformLoader.mm
      - path: Vibe/Debug/AudioLoadTiming.m
      - path: Vibe/Debug/AudioLoadingConfiguration+Debug.m
      - path: Vibe/Debug/DebugWireFormat.m
      - path: Vibe/Debug/VibeFakeCloud.m
      - path: Vibe/Audio/Mac/Convert/AudioFileConverter.m
      - path: Vibe/Audio/Mac/Convert/AudioFileConverter+Sandbox.m
      - path: Vibe/Audio/AudioTrack.m
      - path: Vibe/Audio/AudioVoiceBus.m
      - path: Vibe/Audio/AudioResampler.mm
      - path: Vibe/ThirdParty/r8brain/DLL/r8bsrc.cpp
        compilerFlags: *r8brain-flags
      - path: Vibe/ThirdParty/r8brain/fft/pffft_double.c
        compilerFlags: *r8brain-flags
      - path: Vibe/Audio/FX/AudioFX.m
      - path: Vibe/Debug/VibeManualRenderPump.m
      - path: Vibe/Audio/AudioFileFormat.m
      - path: Vibe/Audio/AudioError.m
      - path: Vibe/Audio/Loading/AudioLoadingConfiguration.m
      - path: Vibe/Audio/AudioFileHandle.m
      - path: Vibe/ThirdParty/dr_mp3/dr_mp3.c
        compilerFlags: *dr-mp3-flags
      - path: Vibe/Audio/Loading/AudioFileMaterializationCoordinator.m
      - path: Vibe/Audio/Loading/AudioWorkScheduler.m
      - path: Vibe/Audio/Levels/AudioLevelAnalyzer.m
      - path: Vibe/Audio/Levels/AudioLevelPublisher.m
      - path: Vibe/Audio/Metadata/AudioTrackMetadataLoader.m
      - path: Vibe/Audio/Metadata/MetadataParseCoordinator.m
      - path: Vibe/Audio/PlaybackRequestCoordinator.m
      - path: Vibe/Audio/Metadata/FolderArt/FolderArtResolver.m
      - path: Vibe/Audio/Metadata/FolderArt/FolderArtEntry.m
      - path: Vibe/Audio/Metadata/FolderArt/FolderArtFileIO.m
      - path: Vibe/Audio/Metadata/AudioTrackArtwork.m
      - path: Vibe/Audio/Metadata/ArtworkLoadRegistry.m
      - path: Vibe/Audio/Loading/CloudTransferRegistry.m
      - path: Vibe/Common/AppSettings.m
      - path: Vibe/Common/Mac/AppSettings+Mac.m
      - path: Vibe/Common/Mac/Theme/AppTheme.m
      - path: Vibe/Common/Mac/Theme/AppTheme+Archive.m
      - path: Vibe/System/NowPlayingController.m
      - path: Vibe/System/CloudFileMaterializer.m
      - path: Vibe/System/DownloadProgressMonitor.m
      - path: Vibe/System/DownloadProgressSourceAdapters.m
      - path: Vibe/Mac/MainWindow/ArtworkDisplayController.m
      - path: Vibe/Mac/Controls/CrossfadingImageView.m
      - path: Vibe/Audio/Mac/Devices/AudioDevice.m
      - path: Vibe/Audio/Mac/Devices/AudioDeviceManager.m
      - path: Vibe/Audio/Mac/Devices/CoreAudioUtil.m
      - path: Vibe/Audio/AudioOutputUnit.m
      - path: Vibe/Mac/App/FolderAccessManager.m
      - path: Vibe/Mac/App/OpenBurstCoalescer.m
      - path: Vibe/Mac/App/OpenRequestCoordinator.m
      - path: Vibe/Mac/MainWindow/Transport/TransportKeyMonitor.m
      - path: Vibe/Playlist/Playlist.m
      - path: Vibe/Util/NSURLUtil.m
      - path: Vibe/Util/UIUpdateTimer.m
      - path: Vibe/Playlist/PlaylistFile.m
      - path: Vibe/Common/PlayableExtensions.m
      - path: Vibe/Mac/About/VibeLinkLabel.m
      - path: Vibe/Util/Formatters.m
      - path: Vibe/Util/Categories/NSURL+Hash.m
      - path: Vibe/Util/Categories/NSURL+AudioOpen.m
      - path: Vibe/Util/Categories/NSURL+FileIdentity.m
      - path: Vibe/iOS/Player/PageWaveformCoordinator.m
      - path: Vibe/iOS/Search/FileSearchIndex.m
      - path: Vibe/Common/PlatformImage.m
      - path: Vibe/Common/PlatformColor.m
      - path: Vibe/Util/Mac/NSImage+Util.m
      - path: Vibe/Util/Mac/NSView+DarkMode.m  # AppTheme's dynamic colors resolve through its appearance fold
      - path: Vibe/WaveformUI/WaveformTheme.m
      - path: Vibe/WaveformUI/Renderers/WaveformMorphEngine.mm
      - path: Vibe/WaveformUI/Renderers/AudioWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/BasicAudioWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/CupertinoWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/DetailedAudioWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/OversamplingDetailedAudioWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/SonicCirrusWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/WaveformRendererRegistry.mm
      - path: Vibe/Debug/VibeWorkTally.m
    settings:
      base: &hostless-test-settings
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.VibeTests
        # Seconds. A hang guard waits for what must happen, so it costs nothing
        # on a pass and only has to outlast a saturated machine (Tests/AGENTS.md).
        # A gate the test itself releases must outlast the guards it holds across.
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Deliberately NOT set: ENABLE_APP_SANDBOX, ENABLE_HARDENED_RUNTIME
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PLATFORM_DIR)/Developer/Library/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "XCTest"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path/../Frameworks"
          - "$(PLATFORM_DIR)/Developer/Library/Frameworks"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vibe/Common"
          - "$(SRCROOT)/Vibe/System"
          - "$(SRCROOT)/Vibe/Mac/App"
          - "$(SRCROOT)/Vibe/Playlist"
          - "$(SRCROOT)/Vibe/Util"
          - "$(SRCROOT)/Vibe/Util/Categories"
          - "$(SRCROOT)/Vibe/Util/Mac"
          - "$(SRCROOT)/Vibe/Audio"
          - "$(SRCROOT)/Vibe/Audio/Levels"
          - "$(SRCROOT)/Vibe/Audio/Metadata"
          - "$(SRCROOT)/Vibe/Audio/Waveform"
          - "$(SRCROOT)/Vibe/Audio/Analysis"
          - "$(SRCROOT)/Vibe/Audio/FX"
          - "$(SRCROOT)/Vibe/Audio/Loading"
          # Header-only activity/animation seams shared by both controls.
          - "$(SRCROOT)/Vibe/Controls"
          # The theme and zoom math; the renderers, level math and host-less morph engine.
          - "$(SRCROOT)/Vibe/WaveformUI"
          - "$(SRCROOT)/Vibe/WaveformUI/Renderers"
          - "$(SRCROOT)/Vibe/Debug"
          - "$(SRCROOT)/Vibe/Mac/MainWindow"
          - "$(SRCROOT)/Vibe/Audio/Mac/Convert"
          # PINCache's angle-bracket self-import resolves from the vendored root.
          - "$(SRCROOT)/Vibe/ThirdParty"
          # PlayerScreenRules.h: header-only and Foundation-only, so the iOS
          # screen's state machine is testable here. The iOS sources compiled in
          # above are Foundation-only too.
          - "$(SRCROOT)/Vibe/iOS"
    dependencies:
      - sdk: MediaPlayer.framework
      - sdk: Accelerate.framework            # vDSP, throughout AudioWaveform
      - sdk: AppKit.framework                # AudioTrack album art (NSImage)
      - sdk: AVFoundation.framework          # AudioWaveformLoader reads (and its tests write) files

  # Production pipeline rendering, with no test host or output device.
  VibeAudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AudioPlayerRenderTests.m
      - path: Tests/TestFilesystemGuard.m
      - path: Vibe/Audio/AudioPlayer.m
      - path: Vibe/Audio/AudioPlayer+State.m
      - path: Vibe/Audio/AudioPlayer+Pipeline.m
      - path: Vibe/Audio/AudioPlayer+Prefetch.m
      - path: Vibe/Audio/AudioPlayer+Diagnostics.m
      - path: Vibe/Audio/AudioVoiceBus.m
      - path: Vibe/Audio/AudioResampler.mm
      - path: Vibe/ThirdParty/r8brain/DLL/r8bsrc.cpp
        compilerFlags: *r8brain-flags
      - path: Vibe/ThirdParty/r8brain/fft/pffft_double.c
        compilerFlags: *r8brain-flags
      - path: Vibe/Audio/FX/AudioFX.m
      - path: Vibe/Audio/AudioTrack.m
      - path: Vibe/Audio/AudioFileFormat.m
      - path: Vibe/Audio/AudioError.m
      - path: Vibe/Audio/Loading/AudioLoadingConfiguration.m
      - path: Vibe/Audio/AudioFileHandle.m
      - path: Vibe/ThirdParty/dr_mp3/dr_mp3.c
        compilerFlags: *dr-mp3-flags
      - path: Vibe/Audio/Loading/AudioFileMaterializationCoordinator.m
      - path: Vibe/Audio/Loading/AudioWorkScheduler.m
      - path: Vibe/Audio/Loading/CloudTransferRegistry.m
      - path: Vibe/Audio/PlaybackRequestCoordinator.m
      - path: Vibe/Audio/Mac/Devices/AudioPlayer+Devices.m
      - path: Vibe/Audio/Mac/Devices/AudioDevice.m
      - path: Vibe/Audio/Mac/Devices/AudioDeviceManager.m
      - path: Vibe/Audio/Mac/Devices/CoreAudioUtil.m
      - path: Vibe/Audio/AudioOutputUnit.m
      - path: Vibe/Audio/Levels/AudioLevelMeter.m
      - path: Vibe/Audio/Levels/AudioLevelAnalyzer.m
      - path: Vibe/Audio/Levels/AudioLevelPublisher.m
      - path: Vibe/Debug/VibeManualRenderPump.m
      - path: Vibe/Debug/VibeWorkTally.m
      - path: Vibe/System/CloudFileMaterializer.m
      - path: Vibe/System/DownloadProgressMonitor.m
      - path: Vibe/System/DownloadProgressSourceAdapters.m
      - path: Vibe/Util/NSURLUtil.m
      - path: Vibe/Util/Formatters.m
      - path: Vibe/Playlist/PlaylistFile.m
      - path: Vibe/Common/PlayableExtensions.m
      - path: Vibe/Util/Categories/NSURL+AudioOpen.m
      - path: Vibe/Util/Categories/NSURL+FileIdentity.m
      - path: Vibe/Util/Categories/NSURL+Hash.m
    settings:
      base:
        <<: *hostless-test-settings
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.VibeAudioTests
    dependencies:
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: Accelerate.framework

schemes:
  VibeAudioTests:
    build:
      targets:
        VibeAudioTests: [test]
    test:
      config: Debug
      targets:
        # One class per topic, spread across runner processes like VibeTests.
        - name: VibeAudioTests
          parallelizable: true
      environmentVariables:
        VIBE_AUDIO_FIXTURES: "$(SRCROOT)/build/audio-fixtures"
  VibeiOS:
    build:
      parallelizeBuild: true
      targets:
        VibeiOS: all
    run:      { config: Debug }
    profile:  { config: Release }
    analyze:  { config: Debug }
    archive:  { config: Release }
  # The touch driver: `xcodebuild test -scheme VibeiOSDriver` is how
  # drive-ios.sh starts the resident command loop.
  VibeiOSDriver:
    build:
      parallelizeBuild: true
      targets:
        VibeiOSDriver: [test]
    test:
      config: Debug
      targets:
        - VibeiOSDriver
  Vibe:
    build:
      parallelizeBuild: true
      targets:
        Vibe: [run, profile, analyze, archive]
    run:      { config: Debug }
    test:
      config: Debug
      targets:
        # Classes spread across parallel runner processes; TestFilesystemGuard.m
        # gives each its own defaults suite and temp root.
        - name: VibeTests
          parallelizable: true
    profile:  { config: Release }
    analyze:  { config: Debug }
    archive:  { config: Release }
