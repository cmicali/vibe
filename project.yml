name: Vibe

options:
  bundleIdPrefix: com.commonwealthrecordings
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  settingPresets: none
  developmentLanguage: en       # base language of the String Catalogs; also what
                                # $(DEVELOPMENT_LANGUAGE) expands to in Info.plist.
  # knownRegions stays at XcodeGen's default (Base, en): it doesn't gate what
  # ships — the XCStrings compiler emits every language in the catalogs
  # (verified) — and a spec key for it is ignored (XcodeGen derives it from
  # localized file references). It only affects Xcode's project UI and the
  # -exportLocalizations default (pass -exportLanguage explicitly there).
  fileTypes:
    icon:                     # Icon Composer AppIcon.icon: treat the .icon package as a single
      file: true              # file reference (not a group to recurse into) so actool compiles it.

configs:
  Debug: debug
  Release: release

# ---- PROJECT-LEVEL settings (== PBXProject build configs) ----
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: 4UEV752JH4
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: c17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    GCC_PRECOMPILE_PREFIX_HEADER: YES
    GCC_PREFIX_HEADER: "$(SRCROOT)/Vibe/Common/Vibe-Prefix.pch"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MTL_FAST_MATH: YES
    SDKROOT: macosx
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES   # Export/Import Localizations round-trips .xcstrings
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - "DEBUG=1"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      ENABLE_NS_ASSERTIONS: NO
      GCC_OPTIMIZATION_LEVEL: s
      MTL_ENABLE_DEBUG_INFO: NO

targets:
  Vibe:
    type: application
    platform: macOS
    sources:
      - path: main.m                          # repo root, outside Vibe/
      - path: Vibe                            # all app + vendored code (incl. .h for header map)
        excludes:
          - "**/.DS_Store"
          - "**/*.xcprivacy"                  # PIN privacy manifests: keep UNbundled
          - "**/*.txt"                        # vendored LICENSE.txt: keep UNbundled
          - "**/LICENSE.MPL"                  # TagLib's MPL 1.1 text: same, but not a .txt
          - "**/*.md"                         # nested CLAUDE.md guidance: keep UNbundled
          - "**/Info.plist"                   # consumed via INFOPLIST_FILE; must NOT be bundled
          - "**/PINDiskCache.m"               # re-added below with its per-file flag
      - path: Vibe/ThirdParty/PINCache/PINDiskCache.m
        compilerFlags:
          - "-fobjc-arc-exceptions"
      - path: Resources/Assets.xcassets       # .xcassets handled natively by XcodeGen
      - path: Resources/AppIcon.icon          # Icon Composer .icon (handled via options.fileTypes)
      # String Catalogs. The build only COMPILES these; keys are extracted by
      # `make strings` (no build-time extraction exists for ObjC — see
      # scripts/extract-strings.sh, deliberately not a build phase).
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
    preBuildScripts:
      # Writes build/generated/VibeGitInfo.h (commit/branch/dirty) for the
      # startup log — see NSBundle+BuildInfo. Runs before the compile phase, and
      # always: the dirty flag changes with edits Xcode wouldn't track as inputs
      # to this phase, and a no-op run costs ~30ms. Reading .git needs
      # ENABLE_USER_SCRIPT_SANDBOXING: NO (already set below).
      - script: '"$SRCROOT/scripts/generate-git-info.sh"'
        name: Generate Git Info
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(SRCROOT)/build/generated/VibeGitInfo.h"
    info:
      path: Vibe/Common/Info.plist
      properties:

        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        LSApplicationCategoryType: "public.app-category.music"

        # Vibe uses no encryption beyond what macOS itself provides. Declaring
        # this here answers the export-compliance question at build time, so
        # App Store Connect stops asking on every single upload.
        ITSAppUsesNonExemptEncryption: false

        NSHumanReadableCopyright: "Copyright © 2026 Christopher Micali. All rights reserved."

        LSMultipleInstancesProhibited: YES
        NSSupportsAutomaticTermination: YES
        NSSupportsSuddenTermination: YES

        NSPrincipalClass: "NSApplication"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleInfoDictionaryVersion: "6.0"

        # The codegen-relevant build settings, carried into the binary for the
        # startup log (NSBundle+BuildInfo reads them back). These are the
        # settings the compile command is DERIVED from, not the literal clang
        # argv — that exists only in the build log. The warning flags are
        # deliberately left out: ~40 CLANG_WARN_* keys don't fit a log line and
        # don't affect codegen.
        VibeBuild:
          Configuration: "$(CONFIGURATION)"
          OptimizationLevel: "-O$(GCC_OPTIMIZATION_LEVEL)"
          PreprocessorDefinitions: "$(GCC_PREPROCESSOR_DEFINITIONS)"
          OtherCFlags: "$(OTHER_CFLAGS)"
          OtherCPlusPlusFlags: "$(OTHER_CPLUSPLUSFLAGS)"
          OtherLinkerFlags: "$(OTHER_LDFLAGS)"
          LanguageStandards: "C $(GCC_C_LANGUAGE_STANDARD) / C++ $(CLANG_CXX_LANGUAGE_STANDARD) / $(CLANG_CXX_LIBRARY)"
          Architectures: "$(ARCHS)"
          DeadCodeStripping: "$(DEAD_CODE_STRIPPING)"
          HardenedRuntime: "$(ENABLE_HARDENED_RUNTIME)"
          AppSandbox: "$(ENABLE_APP_SANDBOX)"

        CFBundleDocumentTypes:
          - CFBundleTypeName: "Folder"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "public.folder"
          - CFBundleTypeName: "Audio Files"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Default"
            LSItemContentTypes:
              - "public.mp2"
              - "public.mp3"
              - "public.aac-audio"
              - "public.aiff-audio"
              - "com.microsoft.waveform-audio"
              - "org.xiph.flac"
              - "com.apple.m4a-audio"
              - "public.mpeg-4-audio"
          # Sandbox plumbing, not an offer to open anything — flac is covered
          # above. NSIsRelatedItemType lets Convert to FLAC claim foo.flac as
          # a related item of an opened foo.wav and write it beside a
          # single-file grant. DocumentTypes.declaredTypes skips such entries,
          # keeping this out of the ⌘O filter and the default-player claim.
          - CFBundleTypeName: "Converted FLAC"
            CFBundleTypeRole: "Editor"
            LSHandlerRank: "None"
            NSIsRelatedItemType: true
            LSItemContentTypes:
              - "org.xiph.flac"

    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: 17
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.Vibe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CLANG_ENABLE_MODULES: YES
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/Vibe/Common/Vibe.entitlements"
        CODE_SIGN_IDENTITY: "-"             # Sign to Run Locally: no dev cert needed (empty
                                            # entitlements, no profile); release.sh re-signs
                                            # with Developer ID for distribution.
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO           # target overrides project-level YES
        ENABLE_USER_SELECTED_FILES: readwrite
        EXCLUDED_ARCHS: ""
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/build/generated"      # VibeGitInfo.h, written by the pre-build script
          - "$(SRCROOT)/Vibe/ThirdParty/taglib"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/toolkit"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg/id3v1"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg/id3v2"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg/id3v2/frames"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/ape"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/mp4"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/flac"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/riff"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/riff/aiff"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/riff/wav"
          - "$(SRCROOT)/Vibe/ThirdParty/taglib/ogg"
          - "$(SRCROOT)/Vibe/ThirdParty"
          - "$(SRCROOT)/Vibe/ThirdParty/PINCache"
          - "$(SRCROOT)/Vibe/ThirdParty/PINOperation"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited)"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: ApplicationServices.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: ImageIO.framework              # AudioTrackMetadata art decode, DebugUtil screenshots
      - sdk: MediaPlayer.framework
      - sdk: Metal.framework                # VectorBallsView (About window)
      - sdk: MetalKit.framework             # VectorBallsView (About window)
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework  # AppDelegate file filtering, DebugUtil

  # Host-LESS logic tests: no TEST_HOST, so the suite never launches the app
  # (which would boot the window, engine and caches on every run) and never
  # inherits its sandbox (which would block reading fixtures from the repo).
  # The tradeoff is that sources under test are compiled in rather than linked
  # from the app — hence the curated list below, which is the point: the
  # tested surface is a deliberate choice, not whatever the glob swept up.
  #
  # Tests live in /Tests, OUTSIDE Vibe/, because the app target's `- path:
  # Vibe` recurses unconditionally — anything under Vibe/ would be compiled
  # into the shipping binary.
  VibeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
      # Sources under test. TagLib is deliberately absent: nothing here needs
      # it (AudioTrack only ever sends messages to its metadata, never names
      # the class), and compiling the ~70-file vendored subset would dominate
      # the build.
      - path: Vibe/Audio/Waveform/AudioWaveform.mm
      - path: Vibe/Audio/AudioTrack.m
      - path: Vibe/Util/Formatters.m
      - path: Vibe/Util/Categories/NSURL+Hash.m
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.VibeTests
        # Synthesized at build time — avoids a second generated plist on disk
        # needing its own .gitignore entry (cf. Vibe/Common/Info.plist).
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Deliberately NOT set: ENABLE_APP_SANDBOX, ENABLE_HARDENED_RUNTIME
        # (app-target-only — a sandboxed test bundle couldn't read fixtures),
        # and ENABLE_USER_SCRIPT_SANDBOXING: NO (that override exists for the
        # app's git-info script phase; tests have none).
        #
        # settingPresets: none means XcodeGen injects nothing for this product
        # type, so the XCTest wiring the preset would normally supply is
        # spelled out here.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PLATFORM_DIR)/Developer/Library/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "XCTest"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path/../Frameworks"
          - "$(PLATFORM_DIR)/Developer/Library/Frameworks"
        # The project-level pch is inherited (its LogError/LogDebug macros are
        # used by the sources under test), and it imports "AppSettings.h" and
        # "HelperMacros.h" by bare quoted name — without these paths it won't
        # precompile. The rest cover the sources under test and their headers.
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vibe/Common"
          - "$(SRCROOT)/Vibe/Util"
          - "$(SRCROOT)/Vibe/Util/Categories"
          - "$(SRCROOT)/Vibe/Audio"
          - "$(SRCROOT)/Vibe/Audio/Metadata"
          - "$(SRCROOT)/Vibe/Audio/Waveform"
          # Header-only: the display-state resolver, the skip arithmetic and
          # the Convert to FLAC rules are static inlines, so the tests reach
          # them without compiling (or linking against) the controllers and
          # the converter they were lifted out of.
          - "$(SRCROOT)/Vibe/Main Window"
          - "$(SRCROOT)/Vibe/Audio/Convert"
    dependencies:
      - sdk: Accelerate.framework            # vDSP, throughout AudioWaveform
      - sdk: AppKit.framework                # AudioTrack album art (NSImage)

schemes:
  Vibe:
    build:
      parallelizeBuild: true
      targets:
        # Every action except test. VibeTests is host-less — it compiles the
        # sources it exercises and never links the app — so building Vibe for
        # a test run is pure latency. Testables are built regardless of this
        # list, so `xcodebuild test` still builds the bundle itself.
        Vibe: [run, profile, analyze, archive]
    run:      { config: Debug }
    test:
      config: Debug
      targets:
        - VibeTests
    profile:  { config: Release }
    analyze:  { config: Debug }
    archive:  { config: Release }
