schemes:
  VibeAudioTests:
    build:
      targets:
        VibeAudioTests: [test]
    test:
      config: Debug
      targets:
        # One class per topic, spread across runner processes like VibeTests.
        - name: VibeAudioTests
          parallelizable: true
      environmentVariables:
        VIBE_AUDIO_FIXTURES: "$(SRCROOT)/build/audio-fixtures"
  VibeiOS:
    build:
      parallelizeBuild: true
      targets:
        VibeiOS: all
    run:      { config: Debug }
    profile:  { config: Release }
    analyze:  { config: Debug }
    archive:  { config: Release }
  # The touch driver: `xcodebuild test -scheme VibeiOSDriver` is how
  # drive-ios.sh starts the resident command loop.
  VibeiOSDriver:
    build:
      parallelizeBuild: true
      targets:
        VibeiOSDriver: [test]
    test:
      config: Debug
      targets:
        - VibeiOSDriver
  # `make test-ios`. Serial: a hosted bundle runs in the one app process.
  VibeiOSTests:
    build:
      parallelizeBuild: true
      targets:
        VibeiOSTests: [test]
    test:
      config: Debug
      targets:
        - VibeiOSTests
  Vibe:
    build:
      parallelizeBuild: true
      targets:
        Vibe: [run, profile, analyze, archive]
    run:      { config: Debug }
    test:
      config: Debug
      targets:
        # Classes spread across parallel runner processes; TestFilesystemGuard.m
        # gives each its own defaults suite and temp root.
        - name: VibeTests
          parallelizable: true
    profile:  { config: Release }
    analyze:  { config: Debug }
    archive:  { config: Release }
