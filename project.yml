name: Vibe

# vibe-libs, the shared toolbox, is a git submodule at vibe-libs/ (`make project`
# updates it). Its spec gives one template per piece. A target lists the
# pieces it compiles in under `templates:` (vibe-libs/AGENTS.md).
include:
  - path: vibe-libs/vibe-libs.yml

options:
  bundleIdPrefix: com.commonwealthrecordings
  deploymentTarget:
    macOS: "13.0"
    iOS: "26.0"
  createIntermediateGroups: true
  settingPresets: none
  developmentLanguage: en
  fileTypes:
    icon:                     # Icon Composer AppIcon.icon: treat the .icon package as a single
      file: true              # file reference (not a group to recurse into) so actool compiles it.

# Release is the direct download (Developer ID, `make release`); AppStore is
# the Mac App Store archive, the one configuration without the updater. The
# iOS App Store path archives Release.
configs:
  Debug: debug
  Release: release
  AppStore: release

# Shared between the app targets so a second platform cannot drift from the
# first on where TagLib, PINCache and the generated git-info header live.
settingGroups:
  # Keep the app and widget versions together. Release scripts read the built app.
  # A stable release also sets VIBE_BETA_DEBUG to 0 (vibe-release).
  vibe-version:
    MARKETING_VERSION: "1.18"
    CURRENT_PROJECT_VERSION: 324

  vibe-header-paths:
    HEADER_SEARCH_PATHS: &vibe-header-search-paths
      - "$(inherited)"
      - "$(SRCROOT)/build/generated"      # VibeGitInfo.h, written by the pre-build script
      - "$(SRCROOT)/Packages/WaveformCore/Sources/WaveformCore/include"
      # Ahead of taglib/ogg, whose vorbis/vorbisfile.h is TagLib's own.
      - "$(SRCROOT)/Vibe/ThirdParty/vorbis/include"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/toolkit"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg/id3v1"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg/id3v2"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/mpeg/id3v2/frames"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/ape"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/mp4"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/flac"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/riff"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/riff/aiff"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/riff/wav"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/ogg"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/ogg/vorbis"
      - "$(SRCROOT)/Vibe/ThirdParty/taglib/ogg/opus"
      - "$(SRCROOT)/Vibe/ThirdParty"
      - "$(SRCROOT)/Vibe/ThirdParty/PINCache"
      - "$(SRCROOT)/Vibe/ThirdParty/PINOperation"

# ---- PROJECT-LEVEL settings (== PBXProject build configs) ----
settings:
  base:
    VIBE_LIBS_ROOT: "$(SRCROOT)/vibe-libs" # where vibe-libs' templates find their headers
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: 4UEV752JH4
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: c17
    GCC_NO_COMMON_BLOCKS: YES
    # The beta switch: 1 for a beta, 0 for a stable release. It sets
    # VIBE_VERBOSE_LOGGING below and the Beta updates default on the mac.
    VIBE_BETA_DEBUG: 1
    # At 1, info and debug use Default level and all timed steps are logged.
    # At 0, info and debug need live streaming. Only slow timed steps are logged.
    VIBE_VERBOSE_LOGGING: $(VIBE_BETA_DEBUG)
    # Nothing else fails on a compiler warning: the analyze gate matches only
    # checker findings. If a toolchain warns on vendored code, give that file a
    # per-file -Wno-* flag beside the PIN caches' entries rather than turning
    # this off.
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    GCC_PRECOMPILE_PREFIX_HEADER: YES
    GCC_PREFIX_HEADER: "$(SRCROOT)/Vibe/Common/Vibe-Prefix.pch"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MTL_FAST_MATH: YES
    SDKROOT: macosx
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES   # Export/Import Localizations round-trips .xcstrings
  configs:
    Debug:
      # Always verbose in Debug, so info and debug log at Default level, which
      # OS_ACTIVITY_DT_MODE copies to stderr (the vibe-debug skill's device logs).
      VIBE_VERBOSE_LOGGING: 1
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - "DEBUG=1"
        - "VIBE_VERBOSE_LOGGING=$(VIBE_VERBOSE_LOGGING)"
        - "VIBE_BETA_DEBUG=$(VIBE_BETA_DEBUG)"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
    Release: &release-project-settings
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      # Only `archive` turns this on by itself, so without it a local Release
      # `build` (and `make install`) keeps its symbol table and is not what
      # ships. Symbolication comes from the dSYM either way.
      DEPLOYMENT_POSTPROCESSING: YES
      ENABLE_NS_ASSERTIONS: NO
      GCC_OPTIMIZATION_LEVEL: s
      # NDEBUG is used in TagLib
      GCC_PREPROCESSOR_DEFINITIONS:
        - "NDEBUG=1"
        - "VIBE_VERBOSE_LOGGING=$(VIBE_VERBOSE_LOGGING)"
        - "VIBE_BETA_DEBUG=$(VIBE_BETA_DEBUG)"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: NO
    AppStore: *release-project-settings

targets:
  Vibe:
    type: application
    platform: macOS
    # vibe-libs' pieces, compiled in as this target's own sources. Controls and
    # SettingsWindow are macOS only, so VibeiOS never lists them.
    templates: [VibeLibsDSP, VibeLibsGraphics, VibeLibsControls, VibeLibsSettingsWindow]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      # One recursive entry per top-level subsystem rather than `- path: Vibe`,
      # so a new top-level boundary is a deliberate edit.
      #
      # THE DIRECTORY IS THE PLATFORM BOUNDARY: platform halves live in Mac/
      # and iOS/ subdirectories, so neither target needs a per-file or
      # feature-named exclude. Every shared entry carries "iOS/**" whether or
      # not that half exists yet. See the root AGENTS.md and make check-layout.
      - path: Vibe/Audio
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      # The reusable waveform core, a package of its own for other apps
      # (Packages/WaveformCore/AGENTS.md), compiled straight in here.
      # Its summary and band split are the decode's per-sample work, and its
      # raster every picture's: optimized in every configuration, as the
      # decoders are, so a Debug build loads and draws as a shipped one does.
      # -O3, because -Os vectorizes none of its loops. Measured, it cut a
      # cache read's CPU by a third and 3-Band's load frames by a quarter,
      # for 16 KB of code. Every picture stayed byte for byte the same.
      - path: Packages/WaveformCore/Sources
        excludes: ["**/.DS_Store", "**/*.md"]
        compilerFlags: &waveform-core-flags
          - "-O3"
      - path: Vibe/Common
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/Loading
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/NowPlaying
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/Util
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/WaveformUI
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/Controls
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      - path: Vibe/Playlist
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      # Every source here wraps its body in #if DEBUG: in both targets, shipped
      # in neither.
      - path: Vibe/Debug
        excludes: ["**/.DS_Store", "**/*.md", "iOS/**"]
      # Keep vendored diagnostics out of first-party analysis and documentation checks.
      - path: Vibe/ThirdParty
        excludes:
          - "**/.DS_Store"
          - "**/*.md"                         # nested AGENTS.md guidance: keep UNbundled
          - "**/*.xcprivacy"                  # PIN privacy manifests: keep UNbundled
          - "**/*.txt"                        # vendored LICENSE.txt: keep UNbundled
          - "**/LICENSE.MPL"                  # TagLib's MPL 1.1 text: same, but not a .txt
          - "Sparkle/**"                      # prebuilt; the Vibe target re-adds it as a dependency
          - "**/*.inc"                        # r8brain's filter tables, #included by its headers: keep UNbundled
          - "**/PINDiskCache.m"               # re-added below with its per-file flags
          - "**/r8bsrc.cpp"                   # same
          - "**/pffft_double.c"               # same
          - "**/dr_mp3.c"                     # same
          - "**/dr_flac.c"                    # same
          - "**/dr_wav.c"                     # same
          - "ogg/**"                          # libogg: re-added below as its C files alone
          - "vorbis/**"                       # libvorbis: the same
        compilerFlags: &third-party-flags
          - "-Xclang"
          - "-analyzer-disable-all-checks"
          - "-Wno-documentation-html"
      - path: Vibe/ThirdParty/PINCache/PINDiskCache.m
        compilerFlags: &pin-disk-cache-flags
          - "-fobjc-arc-exceptions"
          - "-Xclang"
          - "-analyzer-disable-all-checks"
      # r8brain's own C entry points, where every one of its header templates
      # is instantiated, and its FFT: optimized in every configuration, since
      # at -O0 it costs many times its optimized self, and a Debug build is
      # where the resampler's quality and cost tests run. The empty
      # R8BSRC_DECL is upstream's switch from a DLL to an object file;
      # R8B_PFFFT_DOUBLE (NEON, double precision, Ooura's accuracy) is its
      # README's speed setting. Its other, R8B_EXTFFT, is left off: at the 1%
      # transition band it costs 3-10% more, not less (docs/audio-quality.md).
      - path: Vibe/ThirdParty/r8brain/DLL/r8bsrc.cpp
        compilerFlags: &r8brain-flags
          - "-O3"
          - "-DR8BSRC_DECL="
          - "-DR8B_PFFFT_DOUBLE=1"
          - "-DPFFFT_ENABLE_NEON=1"           # PFFFT's NEON path is opt-in; without it arm64 builds its scalar fallback
          - "-w"                              # vendored C predates -Wstrict-prototypes; not ours to restyle
          - "-Xclang"
          - "-analyzer-disable-all-checks"
      - path: Vibe/ThirdParty/r8brain/fft/pffft_double.c
        compilerFlags: *r8brain-flags
      # dr_mp3's, dr_flac's and dr_wav's implementation units,
      # AudioFileHandle's default MPEG decoder and its FLAC and WAV/AIFF
      # decoders: optimized in every configuration, as r8brain is, so a Debug
      # build decodes as a shipped one does.
      - path: Vibe/ThirdParty/dr_mp3/dr_mp3.c
        compilerFlags: &dr-libs-flags
          - "-O3"
          - "-w"                              # vendored C, not ours to restyle
          - "-Xclang"
          - "-analyzer-disable-all-checks"
      - path: Vibe/ThirdParty/dr_flac/dr_flac.c
        compilerFlags: *dr-libs-flags
      - path: Vibe/ThirdParty/dr_wav/dr_wav.c
        compilerFlags: *dr-libs-flags
      # libogg's framing and libvorbis's decoder, AudioFileHandle's Ogg Vorbis
      # decoder, built as dr_flac is. Their C files alone join the project.
      # Xcode's headermap finds a header by its name from any target, and
      # libvorbis's vorbisfile.h would answer for TagLib's.
      - path: Vibe/ThirdParty/ogg
        includes: ["*.c"]
        compilerFlags: *dr-libs-flags
      - path: Vibe/ThirdParty/vorbis/lib
        includes: ["*.c"]
        compilerFlags: *dr-libs-flags
      - path: Vibe/Mac/App
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
          - "**/Info.plist"                   # consumed via INFOPLIST_FILE; must NOT be bundled
      - path: Vibe/Mac/MainWindow
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Mac/Controls
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Mac/Menu
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Mac/About
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Mac/Settings
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Mac/Convert
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Resources/Assets.xcassets       # .xcassets handled natively by XcodeGen
      - path: Resources/AppIcon.icon          # Icon Composer .icon (handled via options.fileTypes)
      - path: Resources/VectorBalls.metal.txt
        buildPhase: resources                 # runtime-compiled off-main; avoids optional Metal toolchain
      # The build only COMPILES the catalogs; `make strings` extracts keys
      # (nothing extracts ObjC strings at build time).
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Hand-managed (table "ThemeNames"): extraction never touches it;
      # check-translations covers it.
      - path: Resources/ThemeNames.xcstrings
        buildPhase: resources
      # A folder reference: every JSON dropped in ships as a built-in theme.
      - path: Resources/Themes
        type: folder
        buildPhase: resources
      # Parked in the playlist until the user plays or opens something (`welcomeTrackSpent`).
      - path: Resources/vibe-theme.mp3
        buildPhase: resources
    preBuildScripts:
      # build/generated/VibeGitInfo.h for the launch provenance block; reading
      # .git needs ENABLE_USER_SCRIPT_SANDBOXING: NO (set below).
      - script: '"$SRCROOT/scripts/build/generate-git-info.sh"'
        name: Generate Git Info
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(SRCROOT)/build/generated/VibeGitInfo.h"
    postBuildScripts:
      # The Mac App Store build carries no updater (App Review guideline
      # 2.4.5): EXCLUDED_SOURCE_FILE_NAMES keeps the framework out, and this
      # takes Sparkle's keys out of its Info.plist. release-appstore.sh checks
      # both.
      - script: |
          [ "$VIBE_DIRECT_DISTRIBUTION" = 1 ] && exit 0
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          for key in $(/usr/libexec/PlistBuddy -c Print "$plist" | awk '/^    SU/ { print $1 }'); do
              /usr/libexec/PlistBuddy -c "Delete :$key" "$plist"
          done
        name: Remove Updater Keys
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
    info:
      path: Vibe/Mac/App/Info.plist
      properties:

        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        LSApplicationCategoryType: "public.app-category.music"

        NSHumanReadableCopyright: "Copyright © 2026 Christopher Micali. All rights reserved."

        ITSAppUsesNonExemptEncryption: false

        # Open URL: https to any host, plain http only on the local network.
        # InfoPlist.xcstrings localizes the usage text.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Vibe connects to devices on your local network only to play an address you enter, like a music server at home."
        # Sparkle's. The AppStore configuration strips every SU* key from the
        # built Info.plist (the post-build script above). The feed and the key are
        # permanent: every shipped build trusts them.
        SUFeedURL: "$(VIBE_SPARKLE_FEED_URL)"
        SUPublicEDKey: "$(VIBE_SPARKLE_PUBLIC_KEY)"
        SUEnableInstallerLauncherService: true   # required under the App Sandbox
        SUVerifyUpdateBeforeExtraction: true
        # On from the first launch, daily, with no prompt: Sparkle asks only
        # when this key is absent. Settings > General can change both.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400

        LSMultipleInstancesProhibited: YES
        NSSupportsAutomaticTermination: YES

        NSPrincipalClass: "NSApplication"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleInfoDictionaryVersion: "6.0"

        CFBundleDocumentTypes:
          - CFBundleTypeName: "Folder"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "public.folder"
          # What Settings > General's default-player button claims, in this
          # order, one system prompt each: the common formats first, so a user
          # who stops answering still has them. com.apple.quicktime-audio is
          # .qta, the QuickTime container Voice Memos exports; it conforms to
          # neither MPEG-4 claim.
          - CFBundleTypeName: "Audio Files"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Default"
            LSItemContentTypes: &audio-content-types
              - "public.mp3"
              - "org.xiph.flac"
              - "com.apple.m4a-audio"
              - "com.microsoft.waveform-audio"
              - "public.aiff-audio"
              - "public.aac-audio"
              - "public.mpeg-4-audio"
              - "org.xiph.ogg-audio"
              - "com.apple.coreaudio-format"
              - "com.sony.wave64"
              - "public.mp2"
              - "com.apple.quicktime-audio"
          # .m4b, which conforms to neither MPEG-4 claim either. Alternate:
          # Vibe plays an audiobook but never asks to take them from Books.
          - &audiobook-document-type
            CFBundleTypeName: "Audiobook"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "com.apple.protected-mpeg-4-audio-b"
          # Claimed by the default-player button too, after the audio.
          - &cue-sheet-document-type
            CFBundleTypeName: "CUE Sheet"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Default"
            LSItemContentTypes:
              - "com.commonwealthrecordings.cue-sheet"
          - CFBundleTypeName: "M3U Playlist"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Default"
            LSItemContentTypes:
              - "public.m3u-playlist"
          - CFBundleTypeName: "Converted FLAC"
            CFBundleTypeRole: "Editor"
            LSHandlerRank: "None"
            NSIsRelatedItemType: true
            LSItemContentTypes:
              - "org.xiph.flac"

        # Neither system has a UTI for cue sheets (they read as dyn.*).
        UTExportedTypeDeclarations: &cue-sheet-export
          - UTTypeIdentifier: "com.commonwealthrecordings.cue-sheet"
            UTTypeDescription: "CUE Sheet"
            UTTypeConformsTo:
              - "public.plain-text"
            UTTypeTagSpecification:
              public.filename-extension:
                - "cue"

        # Imported, so the system's own declaration wins where there is one;
        # an older system has none, and .ogg would read as dyn.* there. No
        # description, which would be a catalog key for every language.
        UTImportedTypeDeclarations: &ogg-audio-import
          - UTTypeIdentifier: "org.xiph.ogg-audio"
            UTTypeConformsTo:
              - "public.audio"
            UTTypeTagSpecification:
              public.filename-extension:
                - "ogg"
                - "oga"
                - "opus"
              public.mime-type:
                - "audio/ogg"

    settings:
      groups: [vibe-version]
      base:
        # TRAP: in base, not in a settings group. A vibe-libs template's header
        # paths join a target's base setting but replace a group's, which
        # silently drops TagLib's and WaveformCore's.
        HEADER_SEARCH_PATHS: *vibe-header-search-paths
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.Vibe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CLANG_ENABLE_MODULES: YES
        # The direct download's: the App Store's plus Sparkle's network access
        # and installer connection. Temporary exceptions pass Developer ID
        # review, not App Review, so the AppStore configuration signs with
        # Vibe.entitlements instead.
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/Vibe/Mac/App/Vibe-Direct.entitlements"
        CODE_SIGN_IDENTITY: "-"             # Sign to Run Locally: no dev cert; the release
                                            # scripts re-sign for distribution.
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: YES
        # TRAP: off in a local build. Under the hardened runtime, library
        # validation refuses an ad-hoc-signed Sparkle in an ad-hoc-signed app
        # ("different Team IDs"), so it would die at launch. asc_archive turns
        # it on for every archive, and the Developer ID export re-signs both
        # under one team; notarization rejects a build without it.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES    # Open URL, in both builds
        ENABLE_USER_SCRIPT_SANDBOXING: NO           # generate-git-info.sh reads .git
        ENABLE_USER_SELECTED_FILES: readwrite
        EXCLUDED_ARCHS: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited)"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        PROVISIONING_PROFILE_SPECIFIER: ""
        # The one channel marker: 1 for the direct download (Debug, Release),
        # 0 for the Mac App Store. Nothing else may infer the channel.
        VIBE_DIRECT_DISTRIBUTION: 1
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "VIBE_DIRECT_DISTRIBUTION=$(VIBE_DIRECT_DISTRIBUTION)"
        # release.sh's arm64-only archive passes appcast-arm64.xml, so an
        # arm64-only install stays arm64-only.
        VIBE_SPARKLE_FEED_URL: "https://vibeplayer.app/appcast.xml"
        # The public half of the EdDSA key `generate_keys` keeps in the
        # releaser's login keychain. release.sh refuses to ship without it.
        VIBE_SPARKLE_PUBLIC_KEY: "HUolDn2S16W1lsK6ibAmHxeFprgzPCFWzEXQF/QoFIg="
      configs:
        AppStore:
          VIBE_DIRECT_DISTRIBUTION: 0
          CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/Vibe/Mac/App/Vibe.entitlements"
          # Unlinks and unembeds the framework the dependency below adds.
          EXCLUDED_SOURCE_FILE_NAMES: Sparkle.framework
    dependencies:
      # The updater, direct download only (the AppStore configuration above).
      - framework: Vibe/ThirdParty/Sparkle/Sparkle.framework
        embed: true
        codeSign: true
      - sdk: AVFAudio.framework             # AVAudioFormat/PCMBuffer/ChannelLayout; MediaPlayer loads AVFoundation regardless
      - sdk: Accelerate.framework
      - sdk: libcompression.tbd           # WaveformCore's archive (LZFSE)
      - sdk: ApplicationServices.framework
      - sdk: AudioToolbox.framework
      - sdk: Carbon.framework               # TIS/UCKeyTranslate: shortcut labels under the current keyboard layout
      - sdk: CoreAudio.framework
      - sdk: ImageIO.framework              # bounded art decode, debug screenshots
      - sdk: MediaPlayer.framework
      - sdk: Metal.framework                # VectorBallsView (About window)
      - sdk: MetalKit.framework             # VectorBallsView (About window)
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework  # file-type filtering

  # Every shared subsystem minus its Mac/ half, plus Vibe/iOS. Same bundle ID as
  # the mac app: the prerequisite for App Store universal purchase.
  VibeiOS:
    type: application
    platform: iOS
    templates: [VibeLibsDSP, VibeLibsGraphics]
    templateAttributes:
      excludedPlatform: Mac
    sources:
      # A new file in a shared directory joins this target automatically, so it
      # must be AppKit-free or TARGET_OS_OSX-guarded; CI's iOS builds
      # enforce it. See the Vibe target above.
      - path: Vibe/iOS
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Audio
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      # Optimized in every configuration; see the macOS target.
      - path: Packages/WaveformCore/Sources
        excludes: ["**/.DS_Store", "**/*.md"]
        compilerFlags: *waveform-core-flags
      - path: Vibe/Common
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/Loading
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/NowPlaying
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/Util
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/Controls
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/Playlist
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/WaveformUI
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/Debug
        excludes: ["**/.DS_Store", "**/*.md", "Mac/**"]
      - path: Vibe/ThirdParty
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
          - "**/*.xcprivacy"
          - "**/*.txt"
          - "**/LICENSE.MPL"
          - "Sparkle/**"
          - "**/*.inc"
          - "**/PINDiskCache.m"
          - "**/r8bsrc.cpp"
          - "**/pffft_double.c"
          - "**/dr_mp3.c"
          - "**/dr_flac.c"
          - "**/dr_wav.c"
          - "ogg/**"
          - "vorbis/**"
        # Same flags as the macOS target above; see the comment there.
        compilerFlags: *third-party-flags
      - path: Vibe/ThirdParty/PINCache/PINDiskCache.m
        compilerFlags: *pin-disk-cache-flags
      - path: Vibe/ThirdParty/r8brain/DLL/r8bsrc.cpp
        compilerFlags: *r8brain-flags
      - path: Vibe/ThirdParty/r8brain/fft/pffft_double.c
        compilerFlags: *r8brain-flags
      - path: Vibe/ThirdParty/dr_mp3/dr_mp3.c
        compilerFlags: *dr-libs-flags
      - path: Vibe/ThirdParty/dr_flac/dr_flac.c
        compilerFlags: *dr-libs-flags
      - path: Vibe/ThirdParty/dr_wav/dr_wav.c
        compilerFlags: *dr-libs-flags
      - path: Vibe/ThirdParty/ogg
        includes: ["*.c"]
        compilerFlags: *dr-libs-flags
      - path: Vibe/ThirdParty/vorbis/lib
        includes: ["*.c"]
        compilerFlags: *dr-libs-flags
      - path: Resources/AppIcon.icon
      - path: Resources/Assets.xcassets       # record-bg, the no-art vinyl placeholder
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: Resources/vibe-theme.mp3
        buildPhase: resources
    preBuildScripts:
      - script: '"$SRCROOT/scripts/build/generate-git-info.sh"'
        name: Generate Git Info
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(SRCROOT)/build/generated/VibeGitInfo.h"
    info:
      path: Vibe/iOS/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleInfoDictionaryVersion: "6.0"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: "public.app-category.music"
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 Christopher Micali. All rights reserved."
        # Open URL: https to any host, plain http only on the local network.
        # InfoPlist.xcstrings localizes the usage text.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Vibe connects to devices on your local network only to play an address you enter, like a music server at home."
        UILaunchScreen: {}                    # system launch screen; no storyboard
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # All four on iPad: required for a non-fullscreen app, and iPadOS 26
        # windowing lets the user give the window any aspect.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          # One scene, deliberately: VibeiOSSceneDelegate owns the one
          # PlaybackController and its AudioPlayer, so a second scene would
          # create a second player. Still freely resizable on iPadOS 26.
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: VibeiOSSceneDelegate
        # Expose Documents in Files. It is a permanent search root.
        # Keep internal app state elsewhere.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        # The Dropbox app's key (DropboxMirror). Not a secret: the sign-in is
        # PKCE, which needs none, and the redirect it pairs with is the
        # db-<key> scheme Dropbox grants every app without registration.
        VibeDropboxAppKey: n3d3xw7piaqy2fz
        # Share the localized audio, audiobook and CUE declarations.
        # The iOS shell reads M3U files but declares no M3U document type here.
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Audio Files"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Default"
            LSItemContentTypes: *audio-content-types
          - *audiobook-document-type
          - *cue-sheet-document-type
        UTExportedTypeDeclarations: *cue-sheet-export
        UTImportedTypeDeclarations: *ogg-audio-import
    settings:
      groups: [vibe-version]
      base:
        # In base, not in a group: see the Vibe target.
        HEADER_SEARCH_PATHS: *vibe-header-search-paths
        PRODUCT_NAME: Vibe
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.Vibe
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"  # settingPresets: none injects neither
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        # The app group the widget reads through. The mac target has its own
        # entitlements for the sandbox; this file exists only for that group,
        # and the extension carries a matching copy.
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/Vibe/iOS/Vibe.entitlements"
        # The target's Swift is the WidgetKit reloader and the widget's App
        # Intent bodies: WidgetCenter and AppIntents have no Objective-C API.
        # The bridging header is what lets the intents reach VibeiOSSceneDelegate
        # and PlaybackController; ObjC reaches the Swift through Vibe-Swift.h.
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Vibe/iOS/Widget/Vibe-Bridging-Header.h"
        # VIBE_APP switches on the App Intent bodies in VibeWidgetIntents.swift,
        # which compiles into this target AND the extension; only this one can
        # link the classes they drive. settingPresets is none, so nothing sets
        # this for us.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VIBE_APP"
        ENABLE_USER_SCRIPT_SANDBOXING: NO     # generate-git-info.sh reads .git
        PROVISIONING_PROFILE_SPECIFIER: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: VibeWidget        # embedded into PlugIns/; see that target
      - sdk: AppIntents.framework           # the widget's transport intents
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework                # AVRoutePickerView (OutputRouteView)
      - sdk: Accelerate.framework
      - sdk: libcompression.tbd           # WaveformCore's archive (LZFSE)
      - sdk: AudioToolbox.framework
      - sdk: AuthenticationServices.framework  # the Dropbox sign-in sheet
      - sdk: ImageIO.framework
      - sdk: MediaPlayer.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework             # the Dropbox refresh token's Keychain item
      - sdk: UniformTypeIdentifiers.framework

  # The home-screen widget. A SECOND PROCESS: no engine, no playlist, no audio
  # session, and it never opens an audio file. Everything it draws is the
  # snapshot the app publishes into the shared app group, which is why its only
  # shared sources are VibeWidgetState's pair — named file by file, because the
  # rest of Vibe/iOS/Widget/ is app-side code that reaches for app classes.
  #
  # Its own sources live OUTSIDE Vibe/, as Tests/ does and for the same reason:
  # the app targets recurse whole subsystem directories, so a file under Vibe/
  # would compile into the shipping apps as well. check-layout asserts the
  # top level of Vibe/ is in BOTH app targets, which an iOS-only extension
  # directory could never be.
  VibeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: VibeWidget
        excludes: ["**/.DS_Store", "**/*.md", "**/Info.plist"]
      - path: Vibe/iOS/Widget/VibeWidgetState.h
      - path: Vibe/iOS/Widget/VibeWidgetState.m
      # Shared with the app, which owns the bodies (VIBE_APP). The extension
      # needs the TYPES so its buttons can name them.
      - path: Vibe/iOS/Widget/VibeWidgetIntents.swift
      # Its catalog is VibeWidget/Localizable.xcstrings, picked up by the entry
      # above — the widget.* subset `make strings` derives, never edited by
      # hand. Why the widget needs its own: the TRAP in VibeWidgetIntents.swift.
    info:
      path: VibeWidget/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: Vibe
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      groups: [vibe-version]
      base:
        PRODUCT_NAME: VibeWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.Vibe.Widget
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/VibeWidget/VibeWidget.entitlements"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/VibeWidget/VibeWidget-Bridging-Header.h"
        GCC_PREFIX_HEADER: ""                 # no app pch: this target links no app class
        SKIP_INSTALL: YES
    dependencies:
      - sdk: AppIntents.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework

  # Not a test suite: the interactive touch driver for agentic workflows —
  # the iOS counterpart of the debug channel's key/click injection, which
  # UIKit cannot do in-process (no public UITouch synthesis). One resident
  # XCUITest command loop; drive-ios.sh in the vibe-debug skill starts it and
  # sends gestures. Sources live under Tests/ for the same reason VibeTests'
  # do: the app targets recurse whole subsystem directories under Vibe/.
  VibeiOSDriver:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/iOSDriver
    dependencies:
      - target: VibeiOS
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.VibeiOSDriver
        TEST_TARGET_NAME: VibeiOS
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"       # the driver must install beside the app on iPad sims too
        CODE_SIGN_STYLE: Automatic
        GCC_PREFIX_HEADER: ""               # no app pch; XCTest only

  # The iOS shell's views and controllers on a simulator (Tests/AGENTS.md).
  # HOSTED on VibeiOS, unlike VibeTests: the card, the root and the settings
  # screens reach PlaybackController, and through it the whole engine, so
  # compiling them in would repeat the app's source list. The tests link
  # against the app (BUNDLE_LOADER) and import its headers by basename.
  VibeiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOSSim
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Tests/Support/TestFilesystemGuard.m
      - path: Tests/Support/FakeTrackMetadata.m
    dependencies:
      - target: VibeiOS
    settings:
      groups: [vibe-header-paths]
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.VibeiOSTests
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vibe.app/Vibe"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "VIBE_TEST_HANG_TIMEOUT=10"

  # Host-LESS: no TEST_HOST, so the suite never launches the app and never
  # inherits its sandbox (which would block reading fixtures from the repo).
  # Sources under test are compiled in, so the list below is the deliberately
  # chosen tested surface. Tests live outside Vibe/ because the app targets
  # recurse whole subsystem directories.
  VibeTests:
    type: bundle.unit-test
    platform: macOS
    templates: [hostless-test-sources]
    sources:
      # The bundled built-in themes, so the suite's loader reads the SAME
      # files the app ships and testBundledThemesAreValid gates a theme PR.
      - path: Resources/Themes
        type: folder
        buildPhase: resources
      - path: Tests
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
          - "iOSDriver/**"                    # VibeiOSDriver's XCUI sources: iOS-only API
          - "BenchComponents/**"              # the component benchmarks, perf.py's tool
          - "AudioRender/**"                  # VibeAudioTests' suite
          - "Audio/Metadata/AudioTrackMetadataTagTests.mm"    # VibeAudioTests': TagLib
          - "Audio/Metadata/AudioTrackMetadataFuzzTests.mm"   # same
          - "iOSSim/**"                       # VibeiOSTests' suite: UIKit, on a simulator
      - path: Vibe/Audio/Analysis/AudioBPMAnalyzer.mm
      - path: Vibe/Audio/Analysis/AudioKeyAnalyzer.mm
      - path: Vibe/Playlist/AudioAnalysisObservers.m
      - path: Vibe/Audio/Waveform/AudioWaveformObserver.m
      - path: Vibe/Audio/Waveform/AudioWaveform.mm
      - path: Packages/WaveformCore/Sources
        excludes: ["**/.DS_Store", "**/*.md"]
        compilerFlags: *waveform-core-flags
      - path: Packages/WaveformCore/Tests   # the package's own, which swift test runs too
        excludes: ["**/.DS_Store", "**/*.md"]
      - path: Vibe/Audio/Waveform/AudioWaveformLoader.mm
      - path: Vibe/Audio/Waveform/AudioWaveformCache.mm   # over a store of the test's own (initWithRootPath:)
      - path: Vibe/Debug/Seams/AudioWaveformCache+Debug.mm   # the decode pace the loader reads
      - path: Vibe/Audio/PINCache+VibeAudioCache.m
      - path: Vibe/Util/Categories/NSURL+FileIdentity.m   # AudioFileConverter+Sandbox's same-file test
      - path: Vibe/ThirdParty/PINCache/PINCache.m
        compilerFlags: *third-party-flags
      - path: Vibe/ThirdParty/PINCache/PINMemoryCache.m
        compilerFlags: *third-party-flags
      - path: Vibe/ThirdParty/PINCache/PINDiskCache.m
        compilerFlags: *pin-disk-cache-flags
      - path: Vibe/ThirdParty/PINOperation/PINOperationGroup.m
        compilerFlags: *third-party-flags
      - path: Vibe/ThirdParty/PINOperation/PINOperationQueue.m
        compilerFlags: *third-party-flags
      - path: Vibe/Debug/Oracles/AudioLoadTiming.m
      - path: Vibe/Debug/Seams/AudioLoadingConfiguration+Debug.m
      - path: Vibe/Debug/Simulators/VibeFakeCloud.m
      - path: Vibe/Mac/Convert/AudioFileConverter.m
      - path: Vibe/Mac/Convert/AudioFileConverter+Sandbox.m
      - path: Vibe/Mac/Convert/AudioFileConverter+Disposal.m
      - path: Vibe/Audio/Metadata/AudioTrackMetadataLoader.m
      - path: Vibe/Audio/Metadata/AudioTrackMetadataLoader+Materialization.m
      - path: Vibe/Audio/Metadata/AudioTrackMetadataLoader+Parse.m
      - path: Vibe/Debug/Seams/AudioTrackMetadataLoader+Debug.m   # the lane state the tests read
      - path: Vibe/Audio/Metadata/MetadataScanEntry.m
      - path: Vibe/Audio/Metadata/MetadataParseCoordinator.m
      - path: Vibe/NowPlaying/NowPlayingController.m
      - path: Vibe/Mac/MainWindow/ArtworkDisplayController.m
      - path: vibe-libs/ui/Controls/Mac/CrossfadingImageView.m
      - path: Vibe/Mac/App/OpenBurstCoalescer.m
      - path: Vibe/Mac/App/OpenRequestCoordinator.m
      - path: Vibe/Mac/MainWindow/Transport/TransportKeyMonitor.m
      - path: Vibe/Mac/MainWindow/MainPlayerController.m   # injected constructor; ShellTestFakes stand in for the rest
      - path: Vibe/Mac/MainWindow/MainPlayerController+Playlist.m
      - path: Vibe/Mac/MainWindow/MainPlayerController+NowPlaying.m
      - path: Vibe/Mac/MainWindow/MainPlayerController+Settings.m
      - path: Vibe/Mac/MainWindow/Transport/MainPlayerController+Transport.m
      - path: Vibe/Playlist/Mac/PlaylistController.m
      - path: Vibe/Playlist/Mac/PlaylistTableView.m
      - path: Vibe/Playlist/Mac/PlaylistRowView.m
      - path: Vibe/Playlist/Mac/PlaylistTextCell.m
      - path: Vibe/Playlist/Mac/PlaylistCoverImageView.m
      - path: vibe-libs/core/Graphics/Mac/Fonts.m
      - path: Vibe/Common/Mac/Theme/Fonts+Theme.m
      - path: Vibe/Controls/EqualizerIndicatorView.m
      - path: Vibe/Controls/LoadingIndicatorView.m
      - path: Vibe/Controls/LoadingIndicator.m
      - path: vibe-libs/ui/Controls/Mac/ScaledImageView.m
      - path: Vibe/Mac/Controls/ArtworkImageView.m          # the drawn views render into a bitmap, windowless
      - path: vibe-libs/ui/Controls/Mac/DrawnControls.m
      - path: Vibe/Mac/Controls/PitchFaderView.m
      - path: vibe-libs/ui/Controls/Mac/SymbolButton.m
      - path: Vibe/Mac/MainWindow/VolumeControlView.m
      - path: Vibe/WaveformUI/Mac/WaveformView.mm
      - path: Vibe/WaveformUI/Mac/WaveformView+Loading.mm
      - path: Vibe/Util/Mac/NSDraggingImageComponent+Util.m
      - path: Vibe/Util/Mac/NSTextField+Label.m
      - path: Vibe/Util/VibeWeakProxy.m
      - path: Vibe/Playlist/Playlist.m
      - path: Vibe/Playlist/Mac/TrackCommands.m
      - path: Vibe/Playlist/Mac/PlaylistFile+Session.m
      - path: Vibe/Util/UIUpdateTimer.m
      - path: Vibe/iOS/Player/PageWaveformCoordinator.m
      - path: Vibe/iOS/Search/FileSearchIndex.m
      # The iOS shell's Foundation-only model: the session and its stores.
      - path: Vibe/iOS/FolderSession.m
      - path: Vibe/iOS/FolderSession+ExternalOpens.m
      - path: Vibe/iOS/FolderSession+Persistence.m
      - path: Vibe/iOS/Files/LocationStore.m
      - path: Vibe/iOS/Files/RecentsStore.m
      - path: Vibe/iOS/Search/FavoritesStore.m
      - path: Vibe/iOS/Search/DropboxSearch.m
      - path: Vibe/iOS/Widget/VibeWidgetState.m
      - path: Vibe/Common/AppStats.m   # FolderSession counts opens
      - path: Vibe/Loading/iOS/Dropbox/DropboxClient.m
      - path: Vibe/Loading/iOS/Dropbox/DropboxMirror.m
      - path: Vibe/WaveformUI/WaveformTheme.m
      - path: Vibe/Common/WaveformTheme+Settings.m
      - path: Vibe/WaveformUI/Renderers/WaveformMorphEngine.mm
      - path: Vibe/WaveformUI/Renderers/WaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/BasicWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/CupertinoWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/DetailedWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/OversamplingDetailedWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/SonicCirrusWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/ThreeBandWaveformRenderer.mm
      - path: Vibe/WaveformUI/Renderers/WaveformRendererRegistry.mm
    settings:
      base: &hostless-test-settings
        PRODUCT_NAME: "$(TARGET_NAME)"
        # Always 1: the signal and diagnostics tests check the instrumentation
        # a stable release compiles out of the app.
        VIBE_VERBOSE_LOGGING: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.VibeTests
        # Seconds. A hang guard waits for what must happen, so it costs nothing
        # on a pass and only has to outlast a saturated machine (Tests/AGENTS.md).
        # A gate the test itself releases must outlast the guards it holds across.
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Deliberately NOT set: ENABLE_APP_SANDBOX, ENABLE_HARDENED_RUNTIME
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PLATFORM_DIR)/Developer/Library/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "XCTest"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path/../Frameworks"
          - "$(PLATFORM_DIR)/Developer/Library/Frameworks"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vibe/Common"
          - "$(SRCROOT)/Vibe/NowPlaying"
          - "$(SRCROOT)/Vibe/Loading"
          - "$(SRCROOT)/Vibe/Loading/Claim"
          - "$(SRCROOT)/Vibe/Loading/Transfer"
          - "$(SRCROOT)/Vibe/Loading/Net"
          - "$(SRCROOT)/Vibe/Loading/iOS/Dropbox"
          - "$(SRCROOT)/Vibe/Mac/App"
          - "$(SRCROOT)/Vibe/Playlist"
          - "$(SRCROOT)/Vibe/Util"
          - "$(SRCROOT)/Vibe/Util/Categories"
          - "$(SRCROOT)/Vibe/Util/Mac"
          - "$(SRCROOT)/Vibe/Audio"
          - "$(SRCROOT)/Vibe/Audio/Levels"
          - "$(SRCROOT)/Vibe/Audio/Metadata"
          - "$(SRCROOT)/Vibe/Audio/Waveform"
          - "$(SRCROOT)/Packages/WaveformCore/Sources/WaveformCore/include"
          - "$(SRCROOT)/Vibe/Audio/Analysis"
          - "$(SRCROOT)/Vibe/Audio/FX"
          # Header-only activity/animation seams shared by both controls.
          - "$(SRCROOT)/Vibe/Controls"
          # The theme and zoom math; the renderers, level math and host-less morph engine.
          - "$(SRCROOT)/Vibe/WaveformUI"
          - "$(SRCROOT)/Vibe/WaveformUI/Renderers"
          # The channel, oracles, simulators and seams that the tests and
          # their compiled production sources import.
          - "$(SRCROOT)/Vibe/Debug/Channel"
          - "$(SRCROOT)/Vibe/Debug/Oracles"
          - "$(SRCROOT)/Vibe/Debug/Simulators"
          - "$(SRCROOT)/Vibe/Debug/Seams"
          - "$(SRCROOT)/Vibe/Mac/MainWindow"
          - "$(SRCROOT)/Vibe/Mac/Convert"
          # PINCache's angle-bracket self-import resolves from the vendored root.
          - "$(SRCROOT)/Vibe/ThirdParty"
          # libvorbis's headers, which AudioFileHandleInternal.h includes.
          - "$(SRCROOT)/Vibe/ThirdParty/vorbis/include"
          # PlayerScreenRules.h: header-only and Foundation-only, so the iOS
          # screen's state machine is testable here. The iOS sources compiled in
          # above are Foundation-only too.
          - "$(SRCROOT)/Vibe/iOS"
    dependencies:
      - sdk: MediaPlayer.framework
      - sdk: Accelerate.framework            # vDSP, throughout AudioWaveform
      - sdk: libcompression.tbd           # WaveformCore's archive (LZFSE)
      - sdk: AppKit.framework                # AudioTrack album art (NSImage)
      - sdk: AVFoundation.framework          # AudioWaveformLoader reads (and its tests write) files
      - sdk: AuthenticationServices.framework  # DropboxClient's sign-in, compiled in, never presented
      - sdk: Security.framework              # DropboxClient's Keychain item, never written here

  # Production pipeline rendering, with no test host or output device.
  VibeAudioTests:
    type: bundle.unit-test
    platform: macOS
    templates: [hostless-test-sources]
    sources:
      - path: Tests/AudioRender
      - path: Tests/Support/TestFilesystemGuard.m
      - path: Tests/Support/HTTPStub.m        # a link played over it (AudioPlayerRenderLinkTests)
      - path: Tests/Support/VibeReadAheadScript.m
      - path: Vibe/Audio/AudioPlayer.m
      - path: Vibe/Audio/AudioPlayer+State.m
      - path: Vibe/Audio/AudioPlayer+Pipeline.m
      - path: Vibe/Audio/AudioMasterBus.m
      - path: Vibe/Audio/AudioPlayer+Prefetch.m
      - path: Vibe/Audio/AudioPlayer+Diagnostics.m
      - path: Vibe/Debug/Seams/AudioPlayer+Debug.m   # the render suites drive the player through it
      - path: Vibe/Debug/Seams/AudioLevelPublisher+Debug.m   # debugEqualizerState reads its counters
      - path: Vibe/Util/StallWatch.m
      - path: Vibe/Audio/Mac/Devices/AudioPlayer+Devices.m
      - path: Vibe/Audio/Mac/Devices/AudioPlayer+BitPerfect.m
      - path: Vibe/Audio/Levels/AudioLevelMeter.m
      # The tag parse and its art, over the real TagLib. VibeTests links a
      # decoy instead (Tests/AGENTS.md).
      - path: Tests/Audio/Metadata/AudioTrackMetadataTagTests.mm
      - path: Tests/Audio/Metadata/AudioTrackMetadataFuzzTests.mm
      - path: Vibe/Audio/Metadata/AudioTrackMetadata.mm
      - path: Vibe/Audio/Metadata/TagLibAudioFile.mm
      - path: Vibe/Util/Categories/NSString+CPPStrings.mm
      - path: Vibe/ThirdParty/taglib
        excludes: ["**/.DS_Store", "**/*.md", "**/LICENSE.MPL"]
        compilerFlags: *third-party-flags
    settings:
      base:
        <<: *hostless-test-settings
        PRODUCT_BUNDLE_IDENTIFIER: com.commonwealthrecordings.VibeAudioTests
        # TagLib's headers. The hostless list above replaces the app group's
        # HEADER_SEARCH_PATHS, so they ride on the system key.
        SYSTEM_HEADER_SEARCH_PATHS: *vibe-header-search-paths
    dependencies:
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: Accelerate.framework

targetTemplates:
  # The production sources both test targets compile. A file only one
  # target compiles goes in that target's own list.
  hostless-test-sources:
    sources:
      - path: Vibe/Debug/Simulators/VibeFakeHTTP.m           # HTTPStub's sessionConfiguration
      - path: Vibe/Debug/Simulators/VibeFakeHTTPProtocol.m   # HTTPStub's serving engine
      - path: Vibe/Playlist/AudioTrack.m
      - path: Vibe/Audio/Metadata/NSURL+FilenameTitle.m
      # Optimize the render path for long PCM comparisons without enabling fast math.
      - path: Vibe/Audio/AudioVoiceBus.m
