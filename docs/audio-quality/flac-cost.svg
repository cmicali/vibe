<text class="t" x="357.7" y="309.0" font-size="12" text-anchor="middle" font-weight="650">0.3–0.5 ms</text>
<rect class="bad4" x="406.4" y="292.0" width="109.6" height="26" rx="4"/>
<text class="t" x="461.2" y="309.0" font-size="12" text-anchor="middle">0.5–0.8 ms</text>
<line class="g" x1="24.0" y1="320.0" x2="518.0" y2="320.0" stroke-width="1"/>
<text class="t" x="24.0" y="339.0" font-size="12" text-anchor="start">Slowest 4,096-frame read, fast core</text>
<rect class="good4" x="313.1" y="322.0" width="89.3" height="26" rx="4"/>
<text class="t" x="357.7" y="339.0" font-size="12" text-anchor="middle" font-weight="650">0.08 ms</text>
<rect class="bad4" x="406.4" y="322.0" width="109.6" height="26" rx="4"/>
<text class="t" x="461.2" y="339.0" font-size="12" text-anchor="middle">0.85 ms</text>
<line class="g" x1="24.0" y1="350.0" x2="518.0" y2="350.0" stroke-width="1"/>
<text class="t" x="24.0" y="369.0" font-size="12" text-anchor="start">Added to the app</text>
<rect class="bad4" x="313.1" y="352.0" width="89.3" height="26" rx="4"/>
