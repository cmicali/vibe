<text class="t" x="24.0" y="219.0" font-size="12" text-anchor="start">Decoding a 4-minute 16-bit track, fast core</text>
<rect class="good4" x="313.1" y="202.0" width="89.3" height="26" rx="4"/>
<text class="t" x="357.7" y="219.0" font-size="12" text-anchor="middle" font-weight="650">55 ms</text>
<rect class="bad4" x="406.4" y="202.0" width="109.6" height="26" rx="4"/>
<text class="t" x="461.2" y="219.0" font-size="12" text-anchor="middle">230 ms</text>
<line class="g" x1="24.0" y1="230.0" x2="518.0" y2="230.0" stroke-width="1"/>
<text class="t" x="24.0" y="249.0" font-size="12" text-anchor="start">Data read to play a file</text>
<rect class="good4" x="313.1" y="232.0" width="89.3" height="26" rx="4"/>
<text class="t" x="357.7" y="249.0" font-size="12" text-anchor="middle" font-weight="650">Its size</text>
<rect class="bad4" x="406.4" y="232.0" width="109.6" height="26" rx="4"/>
<text class="t" x="461.2" y="249.0" font-size="12" text-anchor="middle">2.4–5.1× its size</text>
