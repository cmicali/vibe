<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 542 402" width="542" height="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="FLAC: what each decoder costs">
<style>.bg{fill:#fcfcfb}.t{fill:#0b0b0b}.m{fill:#52514e}.q{fill:#898781}.box{fill:#f0efec}.g{stroke:#e1e0d9}.a{stroke:#c3c2b7}.k{stroke:#b9b8b2}.ring{stroke:#fcfcfb}.good1{fill:#ebf6ea}.bad1{fill:#f9eeee}.good2{fill:#ddf0dc}.bad2{fill:#f6e3e2}.good3{fill:#cceacb}.bad3{fill:#f3d5d5}.good4{fill:#b9e3b8}.bad4{fill:#f0c6c5}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t{fill:#f0efec}.m{fill:#c3c2b7}.q{fill:#898781}.box{fill:#262624}.g{stroke:#2c2c2a}.a{stroke:#383835}.k{stroke:#55554f}.ring{stroke:#1a1a19}.good1{fill:#182a17}.bad1{fill:#301e1d}.good2{fill:#173417}.bad2{fill:#3d201f}.good3{fill:#163f15}.bad3{fill:#4b2322}.good4{fill:#154b14}.bad4{fill:#5c2625}}text{font-variant-numeric:tabular-nums}.ln{fill:none;stroke-linejoin:round;stroke-linecap:round}rect.s0,rect.s1,rect.s2,rect.s3,rect.s4,rect.s5,rect.s6,rect.s7,rect.sg{stroke:none}</style>
<rect class="bg" width="542" height="402" rx="10"/>
<text class="t" x="24.0" y="32.0" font-size="15" text-anchor="start" font-weight="600">FLAC: what each decoder costs</text>
<text class="m" x="24.0" y="50.0" font-size="12" text-anchor="start">Ranges run across 13 real tracks, 16 and 24-bit, 44.1 to 192 kHz. Lower is better. Green is</text>
<text class="m" x="24.0" y="68.0" font-size="12" text-anchor="start">the best in each row, red the worst.</text>
<text class="m" x="357.7" y="100.0" font-size="11.5" text-anchor="middle" font-weight="600">Vibe</text>
<text class="m" x="461.2" y="100.0" font-size="11.5" text-anchor="middle" font-weight="600">Apple</text>
<line class="a" x1="24.0" y1="110.0" x2="518.0" y2="110.0" stroke-width="1"/>
<text class="t" x="24.0" y="129.0" font-size="12" text-anchor="start">CPU to play, fast core</text>
<rect class="good4" x="313.1" y="112.0" width="89.3" height="26" rx="4"/>
<text class="t" x="357.7" y="129.0" font-size="12" text-anchor="middle" font-weight="650">0.022–0.10%</text>
<rect class="bad4" x="406.4" y="112.0" width="109.6" height="26" rx="4"/>
<text class="t" x="461.2" y="129.0" font-size="12" text-anchor="middle">0.086–0.58%</text>
<line class="g" x1="24.0" y1="140.0" x2="518.0" y2="140.0" stroke-width="1"/>
<text class="t" x="24.0" y="159.0" font-size="12" text-anchor="start">CPU to play, efficiency core</text>
<rect class="good4" x="313.1" y="142.0" width="89.3" height="26" rx="4"/>
<text class="t" x="357.7" y="159.0" font-size="12" text-anchor="middle" font-weight="650">0.057–0.41%</text>
<rect class="bad4" x="406.4" y="142.0" width="109.6" height="26" rx="4"/>
<text class="t" x="461.2" y="159.0" font-size="12" text-anchor="middle">0.26–1.9%</text>
<line class="g" x1="24.0" y1="170.0" x2="518.0" y2="170.0" stroke-width="1"/>
<text class="t" x="24.0" y="189.0" font-size="12" text-anchor="start">Decoding a 3-minute 24/96 track, efficiency core</text>
<rect class="good4" x="313.1" y="172.0" width="89.3" height="26" rx="4"/>
<text class="t" x="357.7" y="189.0" font-size="12" text-anchor="middle" font-weight="650">0.30 s</text>
<rect class="bad4" x="406.4" y="172.0" width="109.6" height="26" rx="4"/>
<text class="t" x="461.2" y="189.0" font-size="12" text-anchor="middle">1.59 s</text>
