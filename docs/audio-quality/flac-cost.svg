<text class="t" x="24.0" y="143.0" font-size="12" text-anchor="start">CPU to play, fast core</text>
<rect class="good4" x="313.1" y="126.0" width="89.3" height="26" rx="4"/>
<text class="t" x="357.7" y="143.0" font-size="12" text-anchor="middle" font-weight="650">0.022–0.10%</text>
