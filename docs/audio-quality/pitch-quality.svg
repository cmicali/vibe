<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 485 344" width="485" height="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The pitch fader: Vibe&#x27;s converter and Apple&#x27;s Varispeed">
<style>.bg{fill:#fcfcfb}.t{fill:#0b0b0b}.m{fill:#52514e}.q{fill:#898781}.box{fill:#f0efec}.g{stroke:#e1e0d9}.a{stroke:#c3c2b7}.k{stroke:#b9b8b2}.ring{stroke:#fcfcfb}.good1{fill:#ebf6ea}.bad1{fill:#f9eeee}.good2{fill:#ddf0dc}.bad2{fill:#f6e3e2}.good3{fill:#cceacb}.bad3{fill:#f3d5d5}.good4{fill:#b9e3b8}.bad4{fill:#f0c6c5}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t{fill:#f0efec}.m{fill:#c3c2b7}.q{fill:#898781}.box{fill:#262624}.g{stroke:#2c2c2a}.a{stroke:#383835}.k{stroke:#55554f}.ring{stroke:#1a1a19}.good1{fill:#182a17}.bad1{fill:#301e1d}.good2{fill:#173417}.bad2{fill:#3d201f}.good3{fill:#163f15}.bad3{fill:#4b2322}.good4{fill:#154b14}.bad4{fill:#5c2625}}text{font-variant-numeric:tabular-nums}.ln{fill:none;stroke-linejoin:round;stroke-linecap:round}rect.s0,rect.s1,rect.s2,rect.s3,rect.s4,rect.s5,rect.s6,rect.s7,rect.sg{stroke:none}</style>
<rect class="bg" width="485" height="344" rx="10"/>
<text class="t" x="24.0" y="32.0" font-size="15" text-anchor="start" font-weight="600">The pitch fader: Vibe&#x27;s converter and Apple&#x27;s Varispeed</text>
<text class="m" x="24.0" y="50.0" font-size="12" text-anchor="start">Six settings from −16% to +16% at 48 kHz, as ranges. In dB against the signal</text>
<text class="m" x="24.0" y="68.0" font-size="12" text-anchor="start">unless the row says otherwise. Lower is better. Green is the best in each row, red</text>
<text class="m" x="24.0" y="86.0" font-size="12" text-anchor="start">the worst.</text>
<text class="m" x="313.1" y="118.0" font-size="11.5" text-anchor="middle" font-weight="600">Vibe&#x27;s</text>
<text class="m" x="313.1" y="132.0" font-size="11.5" text-anchor="middle" font-weight="600">converter</text>
<text class="m" x="411.7" y="118.0" font-size="11.5" text-anchor="middle" font-weight="600">Apple</text>
<text class="m" x="411.7" y="132.0" font-size="11.5" text-anchor="middle" font-weight="600">Varispeed</text>
<line class="a" x1="24.0" y1="142.0" x2="461.0" y2="142.0" stroke-width="1"/>
<text class="t" x="24.0" y="161.0" font-size="12" text-anchor="start">Distortion + noise, 1 kHz tone</text>
<rect class="good4" x="265.8" y="144.0" width="94.6" height="26" rx="4"/>
<text class="t" x="313.1" y="161.0" font-size="12" text-anchor="middle" font-weight="650">−150 to −152</text>
<rect class="bad4" x="364.4" y="144.0" width="94.6" height="26" rx="4"/>
<text class="t" x="411.7" y="161.0" font-size="12" text-anchor="middle">−129 to −135</text>
<line class="g" x1="24.0" y1="172.0" x2="461.0" y2="172.0" stroke-width="1"/>
<text class="t" x="24.0" y="191.0" font-size="12" text-anchor="start">Distortion + noise, 10 kHz tone</text>
<rect class="good4" x="265.8" y="174.0" width="94.6" height="26" rx="4"/>
<text class="t" x="313.1" y="191.0" font-size="12" text-anchor="middle" font-weight="650">−150 to −153</text>
<rect class="bad4" x="364.4" y="174.0" width="94.6" height="26" rx="4"/>
<text class="t" x="411.7" y="191.0" font-size="12" text-anchor="middle">−93 to −99</text>
<line class="g" x1="24.0" y1="202.0" x2="461.0" y2="202.0" stroke-width="1"/>
<text class="t" x="24.0" y="221.0" font-size="12" text-anchor="start">Distortion + noise, 20 kHz, −8% to +16%</text>
<rect class="good4" x="265.8" y="204.0" width="94.6" height="26" rx="4"/>
<text class="t" x="313.1" y="221.0" font-size="12" text-anchor="middle" font-weight="650">−148 to −151</text>
<rect class="bad4" x="364.4" y="204.0" width="94.6" height="26" rx="4"/>
<text class="t" x="411.7" y="221.0" font-size="12" text-anchor="middle">−83 to −87</text>
<line class="g" x1="24.0" y1="232.0" x2="461.0" y2="232.0" stroke-width="1"/>
<text class="t" x="24.0" y="251.0" font-size="12" text-anchor="start">Twenty tones at once</text>
<rect class="good4" x="265.8" y="234.0" width="94.6" height="26" rx="4"/>
<text class="t" x="313.1" y="251.0" font-size="12" text-anchor="middle" font-weight="650">−149 to −150</text>
<rect class="bad4" x="364.4" y="234.0" width="94.6" height="26" rx="4"/>
<text class="t" x="411.7" y="251.0" font-size="12" text-anchor="middle">−96 to −99</text>
<line class="g" x1="24.0" y1="262.0" x2="461.0" y2="262.0" stroke-width="1"/>
<text class="t" x="24.0" y="281.0" font-size="12" text-anchor="start">False tones when speeding up</text>
<rect class="good4" x="265.8" y="264.0" width="94.6" height="26" rx="4"/>
<text class="t" x="313.1" y="281.0" font-size="12" text-anchor="middle" font-weight="650">−148 to −149</text>
<rect class="bad4" x="364.4" y="264.0" width="94.6" height="26" rx="4"/>
<text class="t" x="411.7" y="281.0" font-size="12" text-anchor="middle">−114 to −133</text>
<line class="g" x1="24.0" y1="292.0" x2="461.0" y2="292.0" stroke-width="1"/>
<text class="t" x="24.0" y="311.0" font-size="12" text-anchor="start">CPU, % of one core</text>
<rect class="bad4" x="265.8" y="294.0" width="94.6" height="26" rx="4"/>
<text class="t" x="313.1" y="311.0" font-size="12" text-anchor="middle">0.20–0.24%</text>
<rect class="good4" x="364.4" y="294.0" width="94.6" height="26" rx="4"/>
<text class="t" x="411.7" y="311.0" font-size="12" text-anchor="middle" font-weight="650">0.07%</text>
</svg>
