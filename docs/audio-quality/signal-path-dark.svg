<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Signal path in regular, bit-perfect and iOS output"><rect width="1000" height="392" rx="8" fill="#1a1a19"/><text x="24.0" y="30.0" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Where the samples go: regular output and bit-perfect output</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Dashed stages only run when needed; everything else passes samples through untouched.</text><text x="24.0" y="84.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="600">Regular (macOS)</text><text x="150.0" y="84.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">FX, pitch and other apps allowed</text><rect x="24.0" y="96" width="120.6" height="54" rx="6" fill="#242423" stroke="#3c3c39"/><text x="84.3" y="118.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Decode</text><text x="84.3" y="136.0" font-size="10.5" fill="#c3c2b7" text-anchor="middle" font-weight="400">to float32</text><path d="M147.6,123.0 h10 m-4,-4 l4,4 l-4,4" fill="none" stroke="#8f8e86" stroke-width="1.5"/><rect x="162.6" y="96" width="120.6" height="54" rx="6" fill="#242423" stroke="#3c3c39" stroke-dasharray="5 4"/><text x="222.9" y="118.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Resample</text><text x="222.9" y="136.0" font-size="10.5" fill="#c3c2b7" text-anchor="middle" font-weight="400">r8brain, if rates differ</text><path d="M286.1,123.0 h10 m-4,-4 l4,4 l-4,4" fill="none" stroke="#8f8e86" stroke-width="1.5"/><rect x="301.1" y="96" width="120.6" height="54" rx="6" fill="#242423" stroke="#3c3c39" stroke-dasharray="5 4"/><text x="361.4" y="118.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Declick</text><text x="361.4" y="136.0" font-size=