<svg xmlns="http://www.w3.org/2000/svg" width="900" height="308" viewBox="0 0 900 308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What dr_mp3 costs, as a share of what Apple's decoder costs"><rect width="900" height="308" rx="8" fill="#1a1a19"/><text x="24.0" y="30.0" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">What dr_mp3 costs, next to Apple's decoder (lower is better)</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Apple's decoder is 100%, the dashed line. A 320 kbps MP3, M4 Max Mac.</text><circle cx="29" cy="72" r="5" fill="#d95926"/><text x="40.0" y="76.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="400">dr_mp3 (Vibe)</text><line x1="154.60000000000002" y1="72" x2="164.60000000000002" y2="72" stroke="#3987e5" stroke-width="2" stroke-dasharray="3,2"/><text x="170.6" y="76.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="400">Apple's built-in decoder = 100%</text><line x1="250.0" y1="96" x2="250.0" y2="264" stroke="#343431"/><text x="250.0" y="280.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">0%</text><line x1="385.0" y1="96" x2="385.0" y2="264" stroke="#343431"/><text x="385.0" y="280.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">25%</text><line x1="520.0" y1="96" x2="520.0" y2="264" stroke="#343431"/><text x="520.0" y="280.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">50%</text><line x1="655.0" y1="96" x2="655.0" y2="264" stroke="#343431"/><text x="655.0" y="280.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">75%</text><line x1="790.0" y1="96" x2="790.0" y2="264" stroke="#343431"/><text x="790.0" y="280.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">100%</text><line x1="790.0" y1="90" x2="790.0" y2="264" stroke="#3987e5" stroke-width="2" stroke-dasharray="4,3"/><text x="238.0" y="114.0" font-size="12" fill="#c3c2b7" text-anchor="end" font-weight="400">CPU to play, fast core</text><path d="M250,104.0 h231.2 a4,4 0 0 1 4,4 v4.0 a4,4 0 0 1 -4,4 h-231.2 z" fill="#d95926"/><text x="491.2" y="114.5" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">44%  (0.044% vs 0.101% of a core)</text><text x="238.0" y="142.0" font-size="12" fill="#c3c2b7" text-anchor="end" font-weight="400">CPU to play, efficiency core</text><path d="M250,132.0 h165.7 a4,4 0 0 1 4,4 v4.0 a4,4 0 0 1 -4,4 h-165.7 z" fill="#d95926"/><text x="425.7" y="142.5" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">31%  (0.11% vs 0.35% of a core)</text><text x="238.0" y="170.0" font-size="12" fill="#c3c2b7" text-anchor="end" font-weight="400">Energy per hour of music</text><path d="M250,160.0 h257.7 a4,4 0 0 1 4,4 v4.0 a4,4 0 0 1 -4,4 h-257.7 z" fill="#d95926"/><text x="517.7" y="170.5" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">48%  (7.9 J vs 16.3 J)</text><text x="238.0" y="198.0" font-size="12" fill="#c3c2b7" text-anchor="end" font-weight="400">Decoding a whole track</text><path d="M250,188.0 h239.1 a4,4 0 0 1 4,4 v4.0 a4,4 0 0 1 -4,4 h-239.1 z" fill="#d95926"/><text x="499.1" y="198.5" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">45%  (176 ms vs 391 ms)</text><text x="238.0" y="226.0" font-size="12" fill="#c3c2b7" text-anchor="end" font-weight="400">Memory per open file</text><path d="M250,216.0 h179.1 a4,4 0 0 1 4,4 v4.0 a4,4 0 0 1 -4,4 h-179.1 z" fill="#d95926"/><text x="439.1" y="226.5" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">34%  (60 KB vs 177 KB)</text><text x="238.0" y="254.0" font-size="12" fill="#c3c2b7" text-anchor="end" font-weight="400">Data read from the file</text><path d="M250,244.0 h35.1 a4,4 0 0 1 4,4 v4.0 a4,4 0 0 1 -4,4 h-35.1 z" fill="#d95926"/><text x="295.1" y="254.5" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">7%  (17 MB vs 235 MB)</text></svg>