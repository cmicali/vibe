<svg xmlns="http://www.w3.org/2000/svg" width="900" height="358" viewBox="0 0 900 358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What dr_mp3 and BASS cost, as a share of what Apple's decoder costs, best first"><rect width="900" height="358" rx="8" fill="#fcfcfb"/><text x="24.0" y="30.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">What each decoder costs, next to Apple's (lower is better)</text><text x="24.0" y="50.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Apple's decoder is 100%, the dashed line. A 320 kbps MP3, M4 Max Mac.</text><circle cx="29" cy="72" r="5" fill="#eb6834"/><text x="40.0" y="76.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">dr_mp3 (Vibe)</text><circle cx="149.8" cy="72" r="5" fill="#8a8984"/><text x="160.8" y="76.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">BASS</text><line x1="206.20000000000002" y1="72" x2="216.20000000000002" y2="72" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3,2"/><text x="222.2" y="76.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">Apple's built-in decoder = 100%</text><line x1="250.0" y1="96" x2="250.0" y2="314" stroke="#e6e5e0"/><text x="250.0" y="330.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">0%</text><line x1="385.0" y1="96" x2="385.0" y2="314" stroke="#e6e5e0"/><text x="385.0" y="330.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">25%</text><line x1="520.0" y1="96" x2="520.0" y2="314" stroke="#e6e5e0"/><text x="520.0" y="330.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">50%</text><line x1="655.0" y1="96" x2="655.0" y2="314" stroke="#e6e5e0"/><text x="655.0" y="330.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">75%</text><line x1="790.0" y1="96" x2="790.0" y2="314" stroke="#e6e5e0"/><text x="790.0" y="330.0" font-size=