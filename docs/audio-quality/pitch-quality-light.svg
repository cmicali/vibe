<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The pitch fader: noise, distortion and false tones"><rect width="900" height="300" rx="8" fill="#fcfcfb"/><text x="24.0" y="30.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">The pitch fader: noise, distortion and false tones</text><text x="24.0" y="50.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">The worst of −16%, −8%, −1%, +1%, +8% and +16%, relative to the signal. Lower (left) is better.</text><circle cx="29" cy="68" r="5" fill="#2a78d6"/><text x="40.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">Apple Varispeed</text><circle cx="199" cy="68" r="5" fill="#eb6834"/><text x="210.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">Vibe’s converter</text><text x="860.0" y="100.0" font-size="11" fill="#8a8984" text-anchor="end" font-weight="400">← better</text><line x1="260.0" y1="112" x2="260.0" y2="256" stroke="#e6e5e0"/><text x="260.0" y="270.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="400">-160</text><line x1="335.0" y1="112" x2="335.0" y2="256" stroke="#e6e5e0"/><text x="335.0" y="270.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="400">-150</text><line x1="410.0" y1="112" x2="410.0" y2="256" stroke="#e6e5e0"/><text x="410.0" y="270.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="400">-140</text><line x1="485.0" y1="112" x2="485.0" y2="256" stroke="#e6e5e0"/><text x="485.0" y="270.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="400">-130</text><line x1="560.0" y1="112" x2="560.0" y2="256" stroke="#e6e5e0"/><text x="560.0" y="270.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="400">-120</text><line x1="635.0" y1="112" x2="635.0" y2="256" stroke="#e6e5e0"/><text x="635.0" y="270.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="400">-110</text><line x1="710.0" y1="112" x2="710.0" y2="256" stroke="#e6e5e0"/><text x="710.0" y="270.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="400">-100</text><line x1="785.0" y1="112" x2="785.0" y2="256" stroke="#e6e5e0"/><text x="785.0" y="270.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="400">-90</text><line x1="860.0" y1="112" x2="860.0" y2="256" stroke="#e6e5e0"/><text x="860.0" y="270.0" font-size="10" fill="#8a8984" text-anchor="middle" font-weight="400">-80</text><text x="860.0" y="282.0" font-size="10" fill="#8a8984" text-anchor="end" font-weight="400">dB</text><text x="248.0" y="132.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">Distortion + noise, 1 kHz tone</text><line x1="491.8" y1="128.0" x2="336.5" y2="128.0" stroke="#8a8984" stroke-width="2"/><circle cx="491.8" cy="128.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Distortion + noise, 1 kHz tone: Apple Varispeed -129.1 dB</title></circle><circle cx="336.5" cy="128.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>Distortion + noise, 1 kHz tone: Vibe’s converter -149.8 dB</title></circle><text x="248.0" y="160.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">Distortion + noise, 10 kHz tone</text><line x1="761.8" y1="156.0" x2="338.0" y2="156.0" stroke="#8a8984" stroke-width="2"/><circle cx="761.8" cy="156.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Distortion + noise, 10 kHz tone: Apple Varispeed -93.1 dB</title></circle><circle cx="338.0" cy="156.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>Distortion + noise, 10 kHz tone: Vibe’s converter -149.6 dB</title></circle><text x="248.0" y="188.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">Distortion + noise, 20 kHz tone, −8% up</text><line x1="839.8" y1="184.0" x2="350.0" y2="184.0" stroke="#8a8984" stroke-width="2"/><circle cx="839.8" cy="184.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Distortion + noise, 20 kHz tone, −8% up: Apple Varispeed -82.7 dB</title></circle><circle cx="350.0" cy="184.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>Distortion + noise, 20 kHz tone, −8% up: Vibe’s converter -148.0 dB</title></circle><text x="248.0" y="216.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">Twenty tones at once</text><line x1="740.0" y1="212.0" x2="342.5" y2="212.0" stroke="#8a8984" stroke-width="2"/><circle cx="740.0" cy="212.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Twenty tones at once: Apple Varispeed -96.0 dB</title></circle><circle cx="342.5" cy="212.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>Twenty tones at once: Vibe’s converter -149.0 dB</title></circle><text x="248.0" y="244.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">False tones when speeding up</text><line x1="608.8" y1="240.0" x2="347.0" y2="240.0" stroke="#8a8984" stroke-width="2"/><circle cx="608.8" cy="240.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>False tones when speeding up: Apple Varispeed -113.5 dB</title></circle><circle cx="347.0" cy="240.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>False tones when speeding up: Vibe’s converter -148.4 dB</title></circle></svg>