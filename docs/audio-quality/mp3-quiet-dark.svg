<svg xmlns="http://www.w3.org/2000/svg" width="900" height="236" viewBox="0 0 900 236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How far below the music the decoding error sits on a quiet passage, best first"><rect width="900" height="236" rx="8" fill="#1a1a19"/><text x="24.0" y="30.0" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Decoding error on a quiet passage (higher is better)</text><text x="24.0" y="50.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">How far below the music the decoder's own error sits, for a passage at −70 dB. More dB means a cleaner quiet passage.</text><circle cx="29" cy="72" r="5" fill="#6b6a64"/><text x="40.0" y="76.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="400">BASS</text><circle cx="90.4" cy="72" r="5" fill="#d95926"/><text x="101.4" y="76.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="400">dr_mp3 (Vibe)</text><circle cx="211.2" cy="72" r="5" fill="#3987e5"/><text x="222.2" y="76.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="400">Apple's built-in decoder</text><line x1="250.0" y1="96" x2="250.0" y2="192" stroke="#343431"/><text x="250.0" y="208.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">0 dB</text><line x1="327.1" y1="96" x2="327.1" y2="192" stroke="#343431"/><text x="327.1" y="208.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">20 dB</text><line x1="404.3" y1="96" x2="404.3" y2="192" stroke="#343431"/><text x="404.3" y="208.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">40 dB</text><line x1="481.4" y1="96" x2="481.4" y2="192" stroke="#343431"/><text x="481.4" y="208.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">60 dB</text><line x1="558.6" y1="96" x2="558.6" y2="192" stroke="#343431"/><text x="558.6" y="208.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">80 dB</text><line x1="635.7" y1="96" x2="635.7" y2="192" stroke="#343431"/><text x="635.7" y="208.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">100 dB</text><line x1="712.9" y1="96" x2="712.9" y2="192" stroke="#343431"/><text x="712.9" y="208.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">120 dB</text><line x1="790.0" y1="96" x2="790.0" y2="192" stroke="#343431"/><text x="790.0" y="208.0" font-size="11" fill="#8f8e86" text-anchor="middle" font-weight="400">140 dB</text><text x="238.0" y="116.0" font-size="12" fill="#c3c2b7" text-anchor="end" font-weight="400">BASS</text><path d="M250,105.0 h486.6 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-486.6 z" fill="#6b6a64"/><text x="746.6" y="117.5" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">127 dB below the music</text><text x="238.0" y="148.0" font-size="12" fill="#c3c2b7" text-anchor="end" font-weight="400">dr_mp3 (Vibe)</text><path d="M250,137.0 h486.2 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-486.2 z" fill="#d95926"/><text x="746.2" y="149.5" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">127 dB below the music</text><text x="238.0" y="180.0" font-size="12" fill="#c3c2b7" text-anchor="end" font-weight="400">Apple built-in</text><path d="M250,169.0 h115.6 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-115.6 z" fill="#3987e5"/><text x="375.6" y="181.5" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="400">31 dB below the music</text></svg>