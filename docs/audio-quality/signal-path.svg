<rect class="box k" x="444" y="214.0" width="118" height="46" rx="6" stroke-width="1"/>
<text class="t" x="503.0" y="234.0" font-size="12" text-anchor="middle" font-weight="600">Your device</text>
<text class="m" x="503.0" y="250.0" font-size="10.5" text-anchor="middle">the file&#x27;s rate</text>
<path class="ln k" stroke-width="1.25" d="M427,237.0 h12 m-4,-4 l4,4 l-4,4"/>
<text class="t" x="24.0" y="294.0" font-size="13" text-anchor="start" font-weight="600">iPhone and iPad</text>
