<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 374" width="1000" height="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Where the samples go">
<style>.bg{fill:#fcfcfb}.t{fill:#0b0b0b}.m{fill:#52514e}.q{fill:#898781}.box{fill:#f0efec}.g{stroke:#e1e0d9}.a{stroke:#c3c2b7}.k{stroke:#b9b8b2}.ring{stroke:#fcfcfb}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t{fill:#f0efec}.m{fill:#c3c2b7}.q{fill:#898781}.box{fill:#262624}.g{stroke:#2c2c2a}.a{stroke:#383835}.k{stroke:#55554f}.ring{stroke:#1a1a19}}text{font-variant-numeric:tabular-nums}.ln{fill:none;stroke-linejoin:round;stroke-linecap:round}rect.s0,rect.s1,rect.s2,rect.s3,rect.s4,rect.s5,rect.s6,rect.s7,rect.sg{stroke:none}</style>
<rect class="bg" width="1000" height="374" rx="10"/>
<text class="t" x="24.0" y="32.0" font-size="15" text-anchor="start" font-weight="600">Where the samples go</text>
<text class="m" x="24.0" y="50.0" font-size="12" text-anchor="start">Every file decodes to 32-bit float. A dashed stage leaves the samples alone until you use it.</text>
<rect class="box k" x="24" y="64.0" width="22" height="12" rx="3" stroke-width="1"/>
<text class="m" x="52.0" y="74.0" font-size="12" text-anchor="start">Always runs</text>
<rect class="bg k" x="150" y="64.0" width="22" height="12" rx="3" stroke-width="1" stroke-dasharray="3 2"/>
<text class="m" x="178.0" y="74.0" font-size="12" text-anchor="start">Skipped when it has nothing to do</text>
<text class="t" x="24.0" y="110.0" font-size="13" text-anchor="start" font-weight="600">Regular output</text>
<text class="m" x="119.3" y="110.0" font-size="12" text-anchor="start">Mac. Effects, pitch and other apps can play.</text>
<rect class="box k" x="24" y="122.0" width="118" height="46" rx="6" stroke-width="1"/>
<text class="t" x="83.0" y="142.0" font-size="12" text-anchor="middle" font-weight="600">Decode</text>
<text class="m" x="83.0" y="158.0" font-size="10.5" text-anchor="middle">to 32-bit float</text>
<rect class="bg k" x="164" y="122.0" width="118" height="46" rx="6" stroke-width="1" stroke-dasharray="4 3"/>
<text class="t" x="223.0" y="142.0" font-size="12" text-anchor="middle" font-weight="600">Resample</text>
<text class="m" x="223.0" y="158.0" font-size="10.5" text-anchor="middle">if the rates differ</text>
<path class="ln k" stroke-width="1.25" d="M147,145.0 h12 m-4,-4 l4,4 l-4,4"/>
<rect class="bg k" x="304" y="122.0" width="118" height="46" rx="6" stroke-width="1" stroke-dasharray="4 3"/>
<text class="t" x="363.0" y="142.0" font-size="12" text-anchor="middle" font-weight="600">Declick</text>
<text class="m" x="363.0" y="158.0" font-size="10.5" text-anchor="middle">10 ms at the edges</text>
<path class="ln k" stroke-width="1.25" d="M287,145.0 h12 m-4,-4 l4,4 l-4,4"/>
<rect class="bg k" x="444" y="122.0" width="118" height="46" rx="6" stroke-width="1" stroke-dasharray="4 3"/>
