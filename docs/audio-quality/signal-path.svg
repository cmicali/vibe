<text class="m" x="783.0" y="158.0" font-size="10.5" text-anchor="middle">below full only</text>
<path class="ln k" stroke-width="1.25" d="M707,145.0 h12 m-4,-4 l4,4 l-4,4"/>
<rect class="box k" x="864" y="122.0" width="118" height="46" rx="6" stroke-width="1"/>
