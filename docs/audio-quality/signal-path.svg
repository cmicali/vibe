<text class="t" x="223.0" y="326.0" font-size="12" text-anchor="middle" font-weight="600">Resample</text>
<text class="m" x="223.0" y="342.0" font-size="10.5" text-anchor="middle">if not the route&#x27;s</text>
<path class="ln k" stroke-width="1.25" d="M147,329.0 h12 m-4,-4 l4,4 l-4,4"/>
<rect class="bg k" x="304" y="306.0" width="118" height="46" rx="6" stroke-width="1" stroke-dasharray="4 3"/>
<text class="t" x="363.0" y="326.0" font-size="12" text-anchor="middle" font-weight="600">Declick</text>
