<text class="t" x="503.0" y="326.0" font-size="12" text-anchor="middle" font-weight="600">DJ FX</text>
<text class="m" x="503.0" y="342.0" font-size="10.5" text-anchor="middle">while in use</text>
<path class="ln k" stroke-width="1.25" d="M427,329.0 h12 m-4,-4 l4,4 l-4,4"/>
<rect class="box k" x="584" y="306.0" width="118" height="46" rx="6" stroke-width="1"/>
<text class="t" x="643.0" y="326.0" font-size="12" text-anchor="middle" font-weight="600">iOS</text>
<text class="m" x="643.0" y="342.0" font-size="10.5" text-anchor="middle">the route</text>
