<text class="m" x="503.0" y="158.0" font-size="10.5" text-anchor="middle">away from 0%</text>
<path class="ln k" stroke-width="1.25" d="M427,145.0 h12 m-4,-4 l4,4 l-4,4"/>
<rect class="bg k" x="584" y="122.0" width="118" height="46" rx="6" stroke-width="1" stroke-dasharray="4 3"/>
