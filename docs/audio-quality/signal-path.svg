<text class="m" x="923.0" y="158.0" font-size="10.5" text-anchor="middle">mixes, converts</text>
<path class="ln k" stroke-width="1.25" d="M847,145.0 h12 m-4,-4 l4,4 l-4,4"/>
<text class="t" x="24.0" y="202.0" font-size="13" text-anchor="start" font-weight="600">Bit-perfect output</text>
<text class="m" x="137.5" y="202.0" font-size="12" text-anchor="start">Mac. The device is set to the file&#x27;s rate.</text>
