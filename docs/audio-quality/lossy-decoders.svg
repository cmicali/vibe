<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 234" width="708" height="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="What each MP3 and AAC decoder hands Vibe">
<style>.bg{fill:#fcfcfb}.t{fill:#0b0b0b}.m{fill:#52514e}.q{fill:#898781}.box{fill:#f0efec}.g{stroke:#e1e0d9}.a{stroke:#c3c2b7}.k{stroke:#b9b8b2}.ring{stroke:#fcfcfb}.good1{fill:#ebf6ea}.bad1{fill:#f9eeee}.good2{fill:#ddf0dc}.bad2{fill:#f6e3e2}.good3{fill:#cceacb}.bad3{fill:#f3d5d5}.good4{fill:#b9e3b8}.bad4{fill:#f0c6c5}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t{fill:#f0efec}.m{fill:#c3c2b7}.q{fill:#898781}.box{fill:#262624}.g{stroke:#2c2c2a}.a{stroke:#383835}.k{stroke:#55554f}.ring{stroke:#1a1a19}.good1{fill:#182a17}.bad1{fill:#301e1d}.good2{fill:#173417}.bad2{fill:#3d201f}.good3{fill:#163f15}.bad3{fill:#4b2322}.good4{fill:#154b14}.bad4{fill:#5c2625}}text{font-variant-numeric:tabular-nums}.ln{fill:none;stroke-linejoin:round;stroke-linecap:round}rect.s0,rect.s1,rect.s2,rect.s3,rect.s4,rect.s5,rect.s6,rect.s7,rect.sg{stroke:none}</style>
<rect class="bg" width="708" height="234" rx="10"/>
<text class="t" x="24.0" y="32.0" font-size="15" text-anchor="start" font-weight="600">What each MP3 and AAC decoder hands Vibe</text>
<text class="m" x="24.0" y="50.0" font-size="12" text-anchor="start">The loud test master, decoded the way Vibe decodes it. Green is good for the sound, red is bad.</text>
<text class="m" x="242.5" y="82.0" font-size="11.5" text-anchor="middle" font-weight="600">Precision</text>
<text class="m" x="360.5" y="82.0" font-size="11.5" text-anchor="middle" font-weight="600">Peaks above full scale</text>
<text class="m" x="559.9" y="82.0" font-size="11.5" text-anchor="middle" font-weight="600">If sent to the device as 16-bit</text>
<line class="a" x1="24.0" y1="92.0" x2="684.0" y2="92.0" stroke-width="1"/>
<text class="t" x="24.0" y="111.0" font-size="12" text-anchor="start">MP3, dr_mp3 (Vibe)</text>
<rect class="good3" x="201.9" y="94.0" width="81.2" height="26" rx="4"/>
<text class="t" x="242.5" y="111.0" font-size="12" text-anchor="middle">32-bit float</text>
<rect class="good3" x="287.1" y="94.0" width="146.8" height="26" rx="4"/>
<text class="t" x="360.5" y="111.0" font-size="12" text-anchor="middle">Kept, up to +0.49 dBFS</text>
<rect class="bad3" x="437.9" y="94.0" width="244.1" height="26" rx="4"/>
<text class="t" x="559.9" y="111.0" font-size="12" text-anchor="middle">Adds noise, clips the peaks</text>
<line class="g" x1="24.0" y1="122.0" x2="684.0" y2="122.0" stroke-width="1"/>
<text class="t" x="24.0" y="141.0" font-size="12" text-anchor="start">AAC, Apple</text>
<rect class="good3" x="201.9" y="124.0" width="81.2" height="26" rx="4"/>
<text class="t" x="242.5" y="141.0" font-size="12" text-anchor="middle">32-bit float</text>
<rect class="good3" x="287.1" y="124.0" width="146.8" height="26" rx="4"/>
<text class="t" x="360.5" y="141.0" font-size="12" text-anchor="middle">Kept, up to +0.79 dBFS</text>
<rect class="bad3" x="437.9" y="124.0" width="244.1" height="26" rx="4"/>
<text class="t" x="559.9" y="141.0" font-size="12" text-anchor="middle">Adds noise at −101 dBFS, clips the peaks</text>
<line class="g" x1="24.0" y1="152.0" x2="684.0" y2="152.0" stroke-width="1"/>
<text class="t" x="24.0" y="171.0" font-size="12" text-anchor="start">MP3, Apple on Apple silicon</text>
<rect class="bad3" x="201.9" y="154.0" width="81.2" height="26" rx="4"/>
<text class="t" x="242.5" y="171.0" font-size="12" text-anchor="middle">16-bit only</text>
<rect class="bad3" x="287.1" y="154.0" width="146.8" height="26" rx="4"/>
<text class="t" x="360.5" y="171.0" font-size="12" text-anchor="middle">Clipped by the decoder</text>
<text class="t" x="559.9" y="171.0" font-size="12" text-anchor="middle">Nothing, it is already 16-bit</text>
<line class="g" x1="24.0" y1="182.0" x2="684.0" y2="182.0" stroke-width="1"/>
<text class="t" x="24.0" y="201.0" font-size="12" text-anchor="start">MP3, Apple on Intel</text>
<rect class="good3" x="201.9" y="184.0" width="81.2" height="26" rx="4"/>
<text class="t" x="242.5" y="201.0" font-size="12" text-anchor="middle">32-bit float</text>
<rect class="bad3" x="287.1" y="184.0" width="146.8" height="26" rx="4"/>
<text class="t" x="360.5" y="201.0" font-size="12" text-anchor="middle">Clipped at full scale</text>
<rect class="bad3" x="437.9" y="184.0" width="244.1" height="26" rx="4"/>
<text class="t" x="559.9" y="201.0" font-size="12" text-anchor="middle">Adds noise at −101 dBFS</text>
</svg>
