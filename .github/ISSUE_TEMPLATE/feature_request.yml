name: Feature request
description: Suggest something Vibe should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Vibe is deliberately small and fast — a player for local files, with no library, no accounts, and no streaming services. Please keep this in mind when making a request.

  - type: textarea
    id: report
    attributes:
      label: What do you want Vibe to do?
      description: Please provide any detail, spec, or screenshots you can provide.
    validations:
      required: true
