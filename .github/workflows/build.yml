name: CI

# Compile check and unit tests on a clean checkout. Vibe.xcodeproj is
# generated from project.yml and not tracked, so CI is the only place that
# regularly proves a fresh clone still builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repo — upload-artifact needs no repo permission —
# so the token carries nothing a compromised dependency could write with.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Four jobs, deliberately: the account runs five macOS jobs at once, shared by
# every run in flight, so each job past that waits for a slot, and the wait was
# once half the wall time. A new check joins a job below rather than adding one.
jobs:
  # The Release build of each app, analyzed. `xcodebuild analyze` compiles,
  # links and signs the whole app before it analyzes, so the analyzing build IS
  # the Release build, and a separate one would compile everything twice.
  #
  # clang's static analyzer fails the leg on any finding outside ThirdParty/.
  # project.yml has had the analyzer's checks on all along
  # (CLANG_ANALYZER_NONNULL, CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION); this job
  # is what makes them a gate rather than a setting nobody ran. Findings are
  # not config-independent — the first one this gate caught showed up in
  # Release and not in Debug — and Release is the configuration that ships.
  #
  # Both targets, because the iOS leg is what analyzes Vibe/iOS and the iOS
  # halves of the shared subsystems; it found two real findings the first time
  # it ran. The Release iOS build matters on its own too: every source under
  # Vibe/Debug wraps its body in #if DEBUG, so Release is the only
  # configuration that compiles those translation units empty, and it is what
  # `make appstore-build-ios` archives. The iOS leg runs against a generic
  # simulator destination, so nothing has to be booted, and signs nothing.
  build:
    # Deployment target is macOS 13, but the code compiles against the macOS 26
    # SDK (Liquid Glass behind availability guards), so an older image's Xcode
    # cannot build this.
    runs-on: macos-26
    # A hung xcodebuild otherwise runs to the 360-minute default, at the
    # macOS runner's 10x billing rate. 45 rather than 30: the macOS leg runs
    # two whole-app analyze builds, Release and AppStore, which share nothing.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: [macos, ios]

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx

      # Only XcodeGen is missing from the runner image; jq ships with macOS 15+,
      # so `brew bundle` has nothing else to do here. See the action for why
      # this doesn't shell out to brew at all.
      - uses: ./.github/actions/setup-xcodegen

      # The macOS leg signs ad-hoc (project.yml CODE_SIGN_IDENTITY: "-"), so no
      # certificates or secrets are needed. Distribution signing lives in
      # scripts/release.sh.
      - name: Build Release and analyze (${{ matrix.leg }})
        run: scripts/analyze.sh Release ${{ matrix.leg }}

      - name: Verify code signature
        if: matrix.leg == 'macos'
        run: |
          codesign --verify --deep --strict --verbose=2 \
            build/AnalyzeDD/Build/Products/Release/Vibe.app

      # The configuration the Mac App Store archive uses, analyzed like
      # Release, since only it compiles the code's App Store branches. It
      # must carry no trace of the updater.
      - name: Analyze AppStore and check it has no updater
        if: matrix.leg == 'macos'
        run: |
          SKIP_GENERATE=1 scripts/analyze.sh AppStore macos
          PRODUCT=Vibe bash -c 'set -euo pipefail; source scripts/asc-build-lib.sh;
            asc_require_no_updater build/AnalyzeDD/Build/Products/AppStore/Vibe.app'

  # Everything Debug: both apps' Debug builds (Vibe/Debug compiles only here,
  # and the iOS one is the check that catches an AppKit leak into a shared
  # directory), then both test suites. Nothing downstream uses these products,
  # so they share one runner rather than each paying for a slot. The steps are
  # independent, so each runs whatever an earlier one did (`!cancelled()`): a
  # compile error in one app still reports the tests.
  build-debug-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcodegen

      - name: Install fixture encoder
        run: brew install ffmpeg

      # The x86_64 slice, not the runner's arm64: the analyzing Release build
      # compiles arm64 alone, so this is where the shipping app's Intel half
      # (and its architecture #ifs) is proven to compile. Same cost either way.
      - name: Build Debug (macos, x86_64)
        run: make build CONFIG=Debug ARGS='ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO'

      - name: Build Debug (ios, simulator)
        if: ${{ !cancelled() }}
        run: make build-ios CONFIG=Debug

      # The VibeTests bundle is host-less pure logic: no app launch, no window
      # server, no audio hardware, no permissions — so it needs nothing from
      # the runner that a build doesn't already need. Anything requiring the
      # running app lives in the vibe-debug command channel, which is not
      # suited to unattended CI (it drives a real window and needs Screen
      # Recording and Accessibility grants).
      #
      # Beside it, the render suite: real AudioPlayer/AudioFX graphs, pulled
      # offline, no audio device or app. The two share nothing but the project
      # (test-audio has its own derived data), and -k keeps one suite's failure
      # from stopping the other. Their logs interleave; the summaries below
      # read each suite's own result bundle.
      - name: Run unit and audio tests
        if: ${{ !cancelled() }}
        run: make -k -j2 test test-audio

      # always(): the counts are most wanted precisely when a step above
      # failed. They read the .xcresult, so they report the run either way and
      # never change the job's outcome.
      - name: Test summary
        if: always()
        run: make test-summary

      - name: Audio test summary
        if: always()
        run: make test-audio-summary

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload audio failures and PCM attachments
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AudioTestResults.xcresult
          path: build/AudioTestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  # Everything that needs no XcodeGen, no generated project and no build —
  # only clang + xcstringstool (Xcode), jq (ships with macOS 15+), swiftc and
  # grep. They are one job because they share that, and so they report as one
  # check rather than paying a runner startup each for work that takes seconds.
  static-checks:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Check string catalog is in sync
        run: make check-strings

      # Reports keys missing a translation, never fails: English-only keys are
      # the expected state between a feature landing and the translation batch
      # at the release cut, and a red main for that whole window would train
      # everyone to ignore the check. release.sh / release-appstore.sh block on
      # it instead. Annotations here make the batch's worklist visible early.
      - name: Report untranslated keys
        run: scripts/check-translations.sh --github

      # The caption-fit measurement compiles scripts/compose-app-store-overlay.swift
      # (swiftc, no project) — no pip installs since the compositor moved off
      # Python/PIL.
      - name: Validate App Store copy
        run: make appstore-validate-copy

      # Grep-only, so it rides this job rather than paying for a build: the
      # mechanical half of AGENTS.md's Vocabulary section.
      - name: Check naming vocabulary
        run: make check-vocabulary

      # Same: the layout rule (shared subsystems in both targets, Mac/ and iOS/
      # the only platform markers) read off project.yml, plus the imports — a
      # shared file may not NAME a Mac-only header, which the headermap would
      # otherwise resolve and build.
      - name: Check layout
        run: make check-layout
