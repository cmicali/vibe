name: CI

# Compile check and unit tests on a clean checkout. Vibe.xcodeproj is
# generated from project.yml and not tracked, so CI is the only place that
# regularly proves a fresh clone still builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Deployment target is macOS 14, but the code compiles against the macOS 26
    # SDK (Liquid Glass behind availability guards), so an older image's Xcode
    # cannot build this.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx

      # Only XcodeGen is missing from the runner image; jq ships with macOS 15+,
      # so `brew bundle` has nothing else to do here. See the action for why
      # this doesn't shell out to brew at all.
      - uses: ./.github/actions/setup-xcodegen

      # Signs ad-hoc (project.yml CODE_SIGN_IDENTITY: "-"), so no certificates
      # or secrets are needed. Distribution signing lives in scripts/release.sh.
      - name: Build ${{ matrix.configuration }}
        run: make build CONFIG=${{ matrix.configuration }}

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "build/DerivedData/Build/Products/${{ matrix.configuration }}/Vibe.app"

  # A job of its own rather than a step on the build matrix: the suite is
  # Debug-only, so hanging it off a two-configuration matrix would either run
  # it twice or run it in a leg where it doesn't belong. Separate also means it
  # reports as its own check and runs alongside the builds rather than behind
  # them.
  test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcodegen

      # The VibeTests bundle is host-less pure logic: no app launch, no window
      # server, no audio hardware, no permissions — so it needs nothing from
      # the runner that a build doesn't already need. Anything requiring the
      # running app lives in the vibe-debug command channel, which is not
      # suited to unattended CI (it drives a real window and needs Screen
      # Recording and Accessibility grants).
      - name: Run unit tests
        run: make test

      # always(): the counts are most wanted precisely when the step above
      # failed. It reads the .xcresult, so it reports the run either way and
      # never changes the job's outcome.
      - name: Test summary
        if: always()
        run: make test-summary

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
          retention-days: 7

  # Fails when Resources/Localizable.xcstrings is stale against the STR_*
  # registry — a reworded string whose `make strings` run was forgotten. Its
  # own job: it needs no XcodeGen, no generated project and no build, only
  # clang + xcstringstool (Xcode) and jq (ships with macOS 15+), and it
  # reports as its own check.
  check-strings:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Check string catalog is in sync
        run: make check-strings

      # Reports keys missing a translation, never fails: English-only keys are
      # the expected state between a feature landing and the translation batch
      # at the release cut, and a red main for that whole window would train
      # everyone to ignore the check. release.sh / release-appstore.sh block on
      # it instead. Annotations here make the batch's worklist visible early.
      - name: Report untranslated keys
        run: scripts/check-translations.sh --github

      # The caption-fit measurement compiles scripts/compose-app-store-overlay.swift
      # (swiftc, no project) — no pip installs since the compositor moved off
      # Python/PIL.
      - name: Validate App Store copy
        run: make appstore-validate-copy

      # Grep-only, so it rides this job rather than paying for a build: the
      # mechanical half of CLAUDE.md's Vocabulary section.
      - name: Check naming vocabulary
        run: make check-vocabulary
