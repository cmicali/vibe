name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Treat uncertain comparisons as code changes. Renames check both paths.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] \
              && files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[] | .filename, .previous_filename // empty')" \
              && [ -n "$files" ] && [ "$(wc -l <<<"$files")" -lt 300 ] \
              && ! grep -qvE '\.md$|^docs/|^Assets/Web/' <<<"$files"; then
              code=false
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "code=$code for $BASE...$HEAD"

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Check naming vocabulary
        run: make check-vocabulary

      - name: Check layout
        if: ${{ !cancelled() }}
        run: make check-layout

      # Report missing translations here. Release scripts make them fatal.
      - name: Report untranslated keys
        if: ${{ !cancelled() }}
        run: scripts/checks/check-translations.sh --github

  # Keep four macOS jobs to limit runner contention. Text-only checks use Linux.
  # Analyze Release: findings can depend on the configuration.
  analyze-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx

      - uses: ./.github/actions/setup-xcodegen

      - name: Build Release and analyze (macOS)
        run: scripts/build/analyze.sh Release macos

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            build/AnalyzeDD/Build/Products/Release/Vibe.app

  analyze-ios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcodegen

      - name: Build Release and analyze (iOS)
        run: scripts/build/analyze.sh Release ios

  build-and-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Check string catalog is in sync
        run: make check-strings

      - name: Validate App Store copy
        if: ${{ !cancelled() }}
        run: make appstore-validate-copy

      - uses: ./.github/actions/setup-xcodegen
        if: ${{ !cancelled() }}

      - name: Build AppStore and check it has no updater
        if: ${{ !cancelled() }}
        run: |
          make build CONFIG=AppStore ARGS='ARCHS=arm64'
          PRODUCT=Vibe bash -c 'set -euo pipefail; source scripts/appstore/asc-build-lib.sh;
            asc_require_no_updater build/DerivedData/Build/Products/AppStore/Vibe.app'

      - name: Build Debug (iOS, simulator)
        if: ${{ !cancelled() }}
        run: make build-ios CONFIG=Debug

      # Hosted in the Debug app on a simulator. Here, beside the iOS build,
      # to keep four macOS jobs.
      - name: Run iOS shell tests (simulator)
        if: ${{ !cancelled() }}
        run: make test-ios

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcodegen

      - name: Install fixture encoder
        run: brew install ffmpeg

      - name: Build Debug (macOS, x86_64)
        run: make build CONFIG=Debug ARGS='ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO'

      - name: Run unit and audio tests
        if: ${{ !cancelled() }}
        run: make -k -j3 test test-audio

      - name: Test summary
        if: always()
        run: make test-summary

      - name: Audio test summary
        if: always()
        run: make test-audio-summary

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload audio failures and PCM attachments
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AudioTestResults.xcresult
          path: build/AudioTestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
