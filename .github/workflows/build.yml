name: CI

# Compile check and unit tests on a clean checkout. Vibe.xcodeproj is
# generated from project.yml and not tracked, so CI is the only place that
# regularly proves a fresh clone still builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repo — upload-artifact needs no repo permission —
# so the token carries nothing a compromised dependency could write with.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Deployment target is macOS 13, but the code compiles against the macOS 26
    # SDK (Liquid Glass behind availability guards), so an older image's Xcode
    # cannot build this.
    runs-on: macos-26
    # A hung xcodebuild otherwise runs to the 360-minute default, at the
    # macOS runner's 10x billing rate.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx

      # Only XcodeGen is missing from the runner image; jq ships with macOS 15+,
      # so `brew bundle` has nothing else to do here. See the action for why
      # this doesn't shell out to brew at all.
      - uses: ./.github/actions/setup-xcodegen

      # Signs ad-hoc (project.yml CODE_SIGN_IDENTITY: "-"), so no certificates
      # or secrets are needed. Distribution signing lives in scripts/release.sh.
      - name: Build ${{ matrix.configuration }}
        run: make build CONFIG=${{ matrix.configuration }}

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "build/DerivedData/Build/Products/${{ matrix.configuration }}/Vibe.app"

  # A job of its own rather than a step on the build matrix: the suite is
  # Debug-only, so hanging it off a two-configuration matrix would either run
  # it twice or run it in a leg where it doesn't belong. Separate also means it
  # reports as its own check and runs alongside the builds rather than behind
  # them.
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcodegen

      # The VibeTests bundle is host-less pure logic: no app launch, no window
      # server, no audio hardware, no permissions — so it needs nothing from
      # the runner that a build doesn't already need. Anything requiring the
      # running app lives in the vibe-debug command channel, which is not
      # suited to unattended CI (it drives a real window and needs Screen
      # Recording and Accessibility grants).
      - name: Run unit tests
        run: make test

      # always(): the counts are most wanted precisely when the step above
      # failed. It reads the .xcresult, so it reports the run either way and
      # never changes the job's outcome.
      - name: Test summary
        if: always()
        run: make test-summary

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
          retention-days: 7

  # clang's static analyzer, failing on any finding outside ThirdParty/.
  # project.yml has had the analyzer's checks on all along
  # (CLANG_ANALYZER_NONNULL, CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION); this job
  # is what makes them a gate rather than a setting nobody ran.
  #
  # It covers BOTH app targets. It used to be the macOS one alone, which left
  # Vibe/iOS and the iOS halves of the shared subsystems — a few thousand lines
  # — analyzed by nothing; the iOS leg found two real findings the first time
  # it ran.
  #
  # A job of its own, and Release: it is a full analyzing build, so hanging it
  # off the build matrix would double that matrix's cost, and the findings are
  # not config-independent — the one this job was written against showed up in
  # Release and not in Debug. Release is the configuration that ships.
  #
  # One matrix leg per target rather than both in one job: each leg is a full
  # analyzing build, so serially they made this the workflow's longest job
  # (~8 min) while in parallel each leg lands at or under the build matrix's
  # own time. The iOS leg runs against a generic simulator destination, so
  # nothing has to be booted.
  analyze:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [macos, ios]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcodegen

      - name: Static analyzer (${{ matrix.leg }})
        run: scripts/analyze.sh Release ${{ matrix.leg }}

  # Compile coverage for the shared subset against the iOS SDK. One
  # configuration and no signing (CODE_SIGNING_ALLOWED=NO): the point is that
  # a TARGET_OS_OSX guard or an AppKit leak into a shared directory fails
  # here, not when someone next opens the iOS target. The generic simulator
  # destination builds without booting a simulator.
  build-ios:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcodegen

      - name: Build VibeiOS (Debug, simulator)
        run: make build-ios CONFIG=Debug

  # Everything that needs no XcodeGen, no generated project and no build —
  # only clang + xcstringstool (Xcode), jq (ships with macOS 15+), swiftc and
  # grep. They are one job because they share that, and so they report as one
  # check rather than paying a runner startup each for work that takes seconds.
  static-checks:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Check string catalog is in sync
        run: make check-strings

      # Reports keys missing a translation, never fails: English-only keys are
      # the expected state between a feature landing and the translation batch
      # at the release cut, and a red main for that whole window would train
      # everyone to ignore the check. release.sh / release-appstore.sh block on
      # it instead. Annotations here make the batch's worklist visible early.
      - name: Report untranslated keys
        run: scripts/check-translations.sh --github

      # The caption-fit measurement compiles scripts/compose-app-store-overlay.swift
      # (swiftc, no project) — no pip installs since the compositor moved off
      # Python/PIL.
      - name: Validate App Store copy
        run: make appstore-validate-copy

      # Grep-only, so it rides this job rather than paying for a build: the
      # mechanical half of CLAUDE.md's Vocabulary section.
      - name: Check naming vocabulary
        run: make check-vocabulary

      # Same: the layout rule (shared subsystems in both targets, Mac/ and iOS/
      # the only platform markers) read off project.yml, plus the imports — a
      # shared file may not NAME a Mac-only header, which the headermap would
      # otherwise resolve and build.
      - name: Check layout
        run: make check-layout
