name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Turns on Xcode's compilation cache for every xcodebuild in a job.
env:
  XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/ci.xcconfig

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Treat uncertain comparisons as code changes. Renames check both paths.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] \
              && files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[] | .filename, .previous_filename // empty')" \
              && [ -n "$files" ] && [ "$(wc -l <<<"$files")" -lt 300 ] \
              && ! grep -qvE '\.md$|^docs/|^Assets/Web/' <<<"$files"; then
              code=false
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "code=$code for $BASE...$HEAD"

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Check naming vocabulary
        run: make check-vocabulary

      - name: Check layout
        if: ${{ !cancelled() }}
        run: make check-layout

      # Report missing translations here. Release scripts make them fatal.
      - name: Report untranslated keys
        if: ${{ !cancelled() }}
        run: scripts/checks/check-translations.sh --github

  # Three macOS jobs: the free plan runs five macOS jobs at once, and a pull
  # request's run often overlaps its merge's run. Text-only checks use Linux.
  # Each job keeps its own compilation cache (.github/ci.xcconfig), restored
  # from main's last run and saved only by main, so a pull request compiles
  # little more than the files it changed. Analyze Release: findings can
  # depend on the configuration.
  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx

      - name: Check string catalog is in sync
        run: make check-strings

      - name: Validate App Store copy
        if: ${{ !cancelled() }}
        run: make appstore-validate-copy

      - uses: ./.github/actions/setup-xcodegen
        if: ${{ !cancelled() }}

      - id: cache
        uses: ./.github/actions/compilation-cache
        if: ${{ !cancelled() }}
        with:
          job: macos

      - name: Build Release and analyze (macOS)
        if: ${{ !cancelled() }}
        run: scripts/build/analyze.sh Release macos

      - name: Verify code signature
        if: ${{ !cancelled() }}
        run: |
          codesign --verify --deep --strict --verbose=2 \
            build/AnalyzeDD/Build/Products/Release/Vibe.app

      # x86_64: the analyze build above is arm64, so this one compiles the
      # Intel slice. The no-updater check reads no architecture.
      - name: Build AppStore (x86_64) and check it has no updater
        if: ${{ !cancelled() }}
        run: |
          make build CONFIG=AppStore ARGS='ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO'
          PRODUCT=Vibe bash -c 'set -euo pipefail; source scripts/appstore/asc-build-lib.sh;
            asc_require_no_updater build/DerivedData/Build/Products/AppStore/Vibe.app'

      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: build/CompilationCache
          key: ${{ steps.cache.outputs.key }}

  ios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IOS_TEST_DEVICE: iPhone 17

    steps:
      # A runner's first boot takes minutes. It runs while the analyze build
      # compiles, and the tests wait for it below.
      - name: Start booting the test simulator
        run: xcrun simctl boot "$IOS_TEST_DEVICE"

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcodegen

      - id: cache
        uses: ./.github/actions/compilation-cache
        with:
          job: ios

      - name: Build Release and analyze (iOS)
        run: scripts/build/analyze.sh Release ios

      # The Debug app the tests are hosted in, built on the way, is the
      # check that catches an AppKit leak into a shared directory.
      - name: Run iOS shell tests (simulator)
        if: ${{ !cancelled() }}
        run: |
          xcrun simctl bootstatus "$IOS_TEST_DEVICE"
          make test-ios

      - name: iOS test summary
        if: always()
        run: make test-ios-summary

      - name: Upload iOS result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iOSTestResults.xcresult
          path: build/iOSTestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: build/CompilationCache
          key: ${{ steps.cache.outputs.key }}

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcodegen

      - id: cache
        uses: ./.github/actions/compilation-cache
        with:
          job: test

      - name: Install fixture encoder
        run: brew install ffmpeg

      - name: Run unit and audio tests
        run: make -k -j3 test test-audio COVERAGE=1

      - name: Test summary
        if: always()
        run: make test-summary

      - name: Audio test summary
        if: always()
        run: make test-audio-summary

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload audio failures and PCM attachments
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AudioTestResults.xcresult
          path: build/AudioTestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: build/CompilationCache
          key: ${{ steps.cache.outputs.key }}
