name: Pages

# Publish Assets/Web to GitHub Pages. Cloudflare uses the same source directory
# through a separate local deployment. The page names vibeplayer.app as canonical.
# Assets/Web/functions holds Cloudflare's Pages Functions. GitHub Pages cannot
# run them, so the upload leaves them out rather than serving their source.
on:
  push:
    branches: [main]
    paths:
      - 'Assets/Web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Only the deploy job needs more than read, and it needs exactly these: pages
# to publish, id-token for the deployment's OIDC exchange.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow an active deployment to finish before publishing another.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Copy the site without the Cloudflare Functions
        run: rsync -a --exclude /functions/ Assets/Web/ site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
